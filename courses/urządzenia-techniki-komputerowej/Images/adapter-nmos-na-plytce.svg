<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 235" role="img" aria-labelledby="title">
  <title id="title">Adapter nMOS w otworach B2, C2 i D2. Bramkę G, dren D i źródło S umieszczono w osobnych kolumnach.</title>
  <rect width="560" height="235" fill="#112235"/>
  <g stroke="#879caf" stroke-width="3">
    <path d="M100 93v102m180-102v102m180-102v102"/>
  </g>
  <g fill="#d6e5f0">
    <circle cx="100" cy="93" r="6"/><circle cx="280" cy="93" r="6"/><circle cx="460" cy="93" r="6"/>
    <circle cx="100" cy="144" r="6"/><circle cx="280" cy="144" r="6"/><circle cx="460" cy="144" r="6"/>
    <circle cx="100" cy="195" r="6"/><circle cx="280" cy="195" r="6"/><circle cx="460" cy="195" r="6"/>
  </g>
  <path d="M100 144v-23m180 23v-23m180 23v-23" stroke="#8cceff" stroke-width="5"/>
  <rect x="74" y="104" width="412" height="30" fill="#28313c" stroke="#8cceff" stroke-width="2"/>
  <g font-family="system-ui,sans-serif" font-size="18" fill="#fff" font-weight="600" text-anchor="middle">
    <text x="100" y="62">Kolumna B</text><text x="280" y="62">Kolumna C</text><text x="460" y="62">Kolumna D</text>
    <text x="100" y="126">G</text><text x="280" y="126">D</text><text x="460" y="126">S</text>
    <text x="34" y="99">1</text><text x="34" y="150">2</text><text x="34" y="201">3</text>
  </g>
  <g font-family="system-ui,sans-serif" font-size="15" fill="#a8d9ff" text-anchor="middle">
    <text x="100" y="220">Bramka · wejście</text><text x="280" y="220">Dren · wyjście</text><text x="460" y="220">Źródło · do masy</text>
  </g>
</svg>