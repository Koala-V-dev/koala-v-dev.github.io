// =============================================================================
// Kea DHCPv4 — czytelny szablon konfiguracji dla Ubuntu Server 26.04
// =============================================================================
//
// Plik używany przez usługę na serwerze:
//   /etc/kea/kea-dhcp4.conf
//
// Sprawdzenie konfiguracji bez uruchamiania serwera:
//   sudo kea-dhcp4 -t /etc/kea/kea-dhcp4.conf
//
// Sprawdzenie rozszerzone (m.in. biblioteki hook):
//   sudo kea-dhcp4 -T /etc/kea/kea-dhcp4.conf
//
// Zastosowanie zmian:
//   sudo systemctl restart kea-dhcp4-server
//   sudo systemctl status kea-dhcp4-server --full --no-pager
//
// Kea używa rozszerzonego formatu JSON. Komentarze //, # oraz /* ... */
// są dozwolone, chociaż nie należą do standardowego formatu JSON.
// =============================================================================

{
  // Cała konfiguracja serwera DHCP dla IPv4 musi znajdować się w "Dhcp4".
  "Dhcp4": {
    // -------------------------------------------------------------------------
    // INTERFEJS SIECIOWY
    // -------------------------------------------------------------------------
    // Kea będzie odbierać zapytania DHCP tylko na podanych interfejsach.
    // Nazwy interfejsów można sprawdzić poleceniem: ip -br address
    "interfaces-config": {
      "interfaces": [
        "enp0s8"
      ]
    },

    // -------------------------------------------------------------------------
    // BAZA DZIERŻAW
    // -------------------------------------------------------------------------
    // Memfile przechowuje aktywne dzierżawy w pamięci i zapisuje je do CSV.
    // Jest to najprostszy wariant, odpowiedni dla zwykłego małego serwera.
    "lease-database": {
      "type": "memfile",

      // Co ile sekund Kea porządkuje plik z dzierżawami.
      "lfc-interval": 3600
    },

    // -------------------------------------------------------------------------
    // CZASY DZIERŻAWY (w sekundach)
    // -------------------------------------------------------------------------
    // renew-timer: klient próbuje odnowić adres po 15 minutach (T1).
    // rebind-timer: klient próbuje odnowić adres u dowolnego serwera po
    //               30 minutach (T2).
    // valid-lifetime: adres jest ważny przez 60 minut.
    "renew-timer": 900,
    "rebind-timer": 1800,
    "valid-lifetime": 3600,

    // -------------------------------------------------------------------------
    // PODSIECI OBSŁUGIWANE PRZEZ SERWER
    // -------------------------------------------------------------------------
    // "subnet4" jest tablicą, dlatego można dopisać kolejne obiekty podsieci.
    "subnet4": [
      {
        // Każda podsieć musi mieć unikalny identyfikator liczbowy.
        "id": 1,

        // Odpowiednik:
        // subnet 192.168.0.0 netmask 255.255.255.0
        "subnet": "192.168.0.0/24",

        // Zakres adresów przydzielanych dynamicznie klientom.
        // Odpowiednik: range 192.168.0.100 192.168.0.200
        "pools": [
          {
            "pool": "192.168.0.100 - 192.168.0.200"
          }
        ],

        // Opcje przekazywane klientom należącym do tej podsieci.
        "option-data": [
          {
            // Brama domyślna — odpowiednik "option routers" w ISC DHCP.
            "name": "routers",
            "data": "192.168.0.1"
          },
          {
            // Serwery DNS — odpowiednik "option domain-name-servers".
            "name": "domain-name-servers",
            "data": "1.1.1.1, 8.8.8.8"
          },
          {
            // Lokalna nazwa domeny przekazywana klientom.
            "name": "domain-name",
            "data": "lan"
          }
        ],

        // ---------------------------------------------------------------------
        // REZERWACJE ADRESÓW
        // ---------------------------------------------------------------------
        // Rezerwacje są przypisane do konkretnej podsieci. Najczytelniej
        // wybierać dla nich adresy spoza puli dynamicznej, np. .10–.99.
        "reservations": [
          {
            // Odpowiednik "hardware ethernet" w ISC DHCP.
            "hw-address": "1a:1b:1c:1d:1e:1f",

            // Odpowiednik "fixed-address" w ISC DHCP.
            "ip-address": "192.168.0.10",
            "hostname": "drukarka"
          }
        ]
      }
    ],

    // -------------------------------------------------------------------------
    // LOGOWANIE
    // -------------------------------------------------------------------------
    // "stdout" kieruje logi do systemd-journald. Można je oglądać poleceniem:
    //   sudo journalctl -u kea-dhcp4-server --no-pager
    "loggers": [
      {
        "name": "kea-dhcp4",
        "output-options": [
          {
            "output": "stdout",
            "pattern": "%-5p %m\n"
          }
        ],

        // Dostępne poziomy: FATAL, ERROR, WARN, INFO oraz DEBUG.
        "severity": "INFO",

        // Ma znaczenie przy severity ustawionym na DEBUG (zakres 0–99).
        "debuglevel": 0
      }
    ]
  }
}

// =============================================================================
// ŚCIĄGA: ISC DHCP SERVER → KEA
// =============================================================================
//
// ISC DHCP                                  Kea
// -----------------------------------------------------------------------------
// subnet ... netmask ...                 -> "subnet": "adres/prefix"
// range adres-początkowy adres-końcowy    -> "pool": "początek - koniec"
// option routers                         -> "name": "routers"
// option domain-name-servers             -> "name": "domain-name-servers"
// default-lease-time                     -> "valid-lifetime"
// hardware ethernet                      -> "hw-address"
// fixed-address                          -> "ip-address"
// host nazwa { ... }                     -> obiekt w tablicy "reservations"
// =============================================================================
