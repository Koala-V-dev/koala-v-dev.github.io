<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="960" viewBox="0 0 1000 960" role="img" aria-labelledby="title desc">
<title id="title">Listwa szuflady pomiędzy korpusem a nieruchomą prowadnicą</title>
<desc id="desc">Przekrój prawej strony modelu w połowie długości. Kolejno od wnętrza: korpus, ruchoma listwa 5 mm, bok prowadnicy 10 mm i wspornik. Pozioma półka prowadnicy podpiera dno korpusu. Niebieski korpus i złota listwa wysuwają się wzdłuż osi Y. Szare elementy pozostają przy stole.</desc>
<defs><clipPath id="section"><rect x="60" y="110" width="380" height="740"/></clipPath><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#253344"/></marker></defs>
<rect width="1000" height="960" fill="#f4f6f8"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#162536">
<text x="40" y="48" font-size="30" font-weight="700">Gdzie znajduje się listwa szuflady?</text>
<text x="40" y="84" font-size="21">Przekrój prawego boku. Patrzymy od przodu, wzdłuż osi Y.</text>
