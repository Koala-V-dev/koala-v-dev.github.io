<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 270" role="img" aria-labelledby="t11 d11">
  <title id="t11">Stos wywołań (Call Stack) podczas wywołania metody i powrotu przez return</title>
  <desc id="d11">Animowany schemat odkładania ramek na stosie: Main wywołuje ObliczRuch, a ta wywołuje CzyWygrana; po return ramki są zdejmowane w kolejności LIFO.</desc>
  <style>
    .bg { fill: #0f172a; }
    .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; }
    .frame1 { fill: #172554; stroke: #38bdf8; stroke-width: 1.8; rx: 8; }
    .frame2 { fill: #064e3b; stroke: #34d399; stroke-width: 1.8; rx: 8; }
    .frame3 { fill: #451a03; stroke: #fbbf24; stroke-width: 1.8; rx: 8; }
    .title { font: 700 14px 'Segoe UI', system-ui, sans-serif; fill: #f8fafc; }
    .sub { font: 500 12px 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; }
    .mono { font: 700 12px Consolas, monospace; fill: #f8fafc; }
    @keyframes popFrame { 0%, 25% { opacity: 0.15; transform: translateY(-10px); } 35%, 75% { opacity: 1; transform: translateY(0); } 85%, 100% { opacity: 0.15; transform: translateY(-10px); } }
    .f3 { animation: popFrame 4s ease-in-out infinite; }
  </style>
  <rect width="840" height="270" rx="14" class="bg"/>
  <text x="24" y="30" class="title">Stos wywołań (Call Stack) — zasada LIFO: Ostatnia weszła, pierwsza wychodzi</text>
  <text x="24" y="48" class="sub">Każde wywołanie metody odkłada nową ramkę z jej zmiennymi lokalnymi. Instrukcja return zdejmuje ramkę.</text>

  <!-- Left: Code flow -->
  <rect x="24" y="68" width="380" height="178" class="card"/>
  <text x="40" y="92" class="title">Kolejność wywołań w kodzie</text>
  <text x="40" y="122" class="mono" fill="#38bdf8">1. Main() startuje</text>
  <text x="58" y="146" class="mono" fill="#34d399">2. → wywołuje ObliczRuch(plansza)</text>
  <text x="76" y="170" class="mono" fill="#fbbf24">3. → wywołuje CzyWygrana('X')</text>
  <text x="76" y="196" class="sub">4. ← return true (zdejmuje ramkę 3)</text>
  <text x="58" y="218" class="sub">5. ← return 4 (zdejmuje ramkę 2)</text>

  <!-- Right: Stack visualization -->
  <rect x="424" y="68" width="392" height="178" class="card"/>
  <text x="440" y="92" class="title">Pamięć stosu (Call Stack — rośnie w górę)</text>

  <g class="f3">
    <rect x="444" y="104" width="352" height="36" class="frame3"/>
    <text x="458" y="126" class="mono">Ramka 3: CzyWygrana(znak='X')  ← RSP</text>
  </g>

  <rect x="444" y="148" width="352" height="36" class="frame2"/>
  <text x="458" y="170" class="mono">Ramka 2: ObliczRuch(bestMove=4)</text>

  <rect x="444" y="192" width="352" height="36" class="frame1"/>
  <text x="458" y="214" class="mono">Ramka 1: Main(tura=5, gracz='X')</text>
</svg>

