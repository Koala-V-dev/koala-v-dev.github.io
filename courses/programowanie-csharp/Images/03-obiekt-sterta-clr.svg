<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 265" role="img" aria-labelledby="t31 d31">
  <title id="t31">Układ obiektu klasy w 64-bitowej pamięci CLR oraz ukryty parametr this</title>
  <desc id="d31">Schemat bajtów obiektu na stercie CLR: 8 B Object Header, 8 B MethodTable Pointer wskazujący na wspólną tablicę metod klasy oraz pola danych konkretnej instancji.</desc>
  <style>
    .bg { fill: #0f172a; }
    .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; }
    .hdr { fill: #451a03; stroke: #fbbf24; rx: 6; }
    .mt { fill: #172554; stroke: #38bdf8; rx: 6; }
    .fld { fill: #064e3b; stroke: #34d399; rx: 6; }
    .title { font: 700 14px 'Segoe UI', system-ui, sans-serif; fill: #f8fafc; }
    .sub { font: 500 12px 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; }
    .mono { font: 700 12px Consolas, monospace; fill: #f8fafc; }
    @keyframes ptrFlow { 0% { stroke-dashoffset: 28; } 100% { stroke-dashoffset: 0; } }
    .beam { stroke: #38bdf8; stroke-width: 2.2; stroke-dasharray: 6 6; animation: ptrFlow 1.2s linear infinite; fill: none; }
  </style>
  <rect width="840" height="265" rx="14" class="bg"/>
  <text x="24" y="30" class="title">Jak obiekt klasy wygląda na stercie CLR (64-bit) — kod metod NIE jest kopiowany</text>
  <text x="24" y="48" class="sub">Każdy egzemplarz trzyma własne pola danych i 8-bajtowy wskaźnik MethodTable do wspólnego kodu klasy.</text>

  <rect x="24" y="66" width="388" height="178" class="card"/>
  <text x="40" y="90" class="title">Obiekt na stercie: new Gracz("Kamil", 100)</text>
  <rect x="40" y="104" width="356" height="28" class="hdr"/><text x="52" y="122" class="mono">+0 B  | Object Header (8 B — lock/hash)</text>
  <rect x="40" y="138" width="356" height="28" class="mt"/><text x="52" y="156" class="mono">+8 B  | MethodTable* (8 B → typ Gracz)</text>
  <rect x="40" y="172" width="356" height="28" class="fld"/><text x="52" y="190" class="mono">+16 B | Nick (ref → "Kamil")</text>
  <rect x="40" y="206" width="356" height="28" class="fld"/><text x="52" y="224" class="mono">+24 B | Hp = 100 (4 B int + 4 B pad)</text>

  <path d="M 396 152 L 466 152" class="beam"/>
  <polygon points="466,147 476,152 466,157" fill="#38bdf8"/>

  <rect x="476" y="66" width="340" height="178" class="card"/>
  <text x="492" y="90" class="title">MethodTable klasy Gracz (JEDNA w RAM)</text>
  <rect x="492" y="106" width="308" height="34" class="mt"/><text x="504" y="127" class="mono">OtrzymajObrazenia(Gracz this, int ile)</text>
  <rect x="492" y="148" width="308" height="34" class="mt"/><text x="504" y="169" class="mono">ToString(Gracz this)</text>
  <text x="492" y="206" class="sub">Wywołanie g.OtrzymajObrazenia(20)</text>
  <text x="492" y="224" class="mono" fill="#34d399">→ Gracz.OtrzymajObrazenia(this: g, 20)</text>
</svg>

