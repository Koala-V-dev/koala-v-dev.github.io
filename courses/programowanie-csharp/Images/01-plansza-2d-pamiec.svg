<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 270" role="img" aria-labelledby="t13 d13">
  <title id="t13">Plansza 2D char[3,3] jako siatka współrzędnych oraz płaski układ Row-Major w pamięci RAM</title>
  <desc id="d13">Po lewej siatka 3 na 3 ze współrzędnymi [wiersz, kolumna] dla gry Kółko i Krzyżyk, po prawej płaski ciąg 9 komórek w pamięci RAM ułożonych wierszami (Row-Major).</desc>
  <style>
    .bg { fill: #0f172a; }
    .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; }
    .cell { fill: #0f172a; stroke: #475569; stroke-width: 1.5; rx: 6; }
    .win { fill: #064e3b; stroke: #34d399; stroke-width: 2; rx: 6; }
    .title { font: 700 14px 'Segoe UI', system-ui, sans-serif; fill: #f8fafc; }
    .sub { font: 500 12px 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; }
    .mono { font: 700 13px Consolas, monospace; fill: #f8fafc; }
    .coord { font: 600 10px Consolas, monospace; fill: #38bdf8; }
    @keyframes diagGlow { 0%, 100% { stroke-opacity: 0.45; } 50% { stroke-opacity: 1; } }
    .diag { animation: diagGlow 2.2s ease-in-out infinite; }
  </style>
  <rect width="840" height="270" rx="14" class="bg"/>
  <text x="24" y="30" class="title">Tablica 2D char[3, 3] — widok logiczny (plansza) kontra fizyczny układ Row-Major w RAM</text>
  <text x="24" y="48" class="sub">Przekątna główna to zawsze [i, i] ([0,0], [1,1], [2,2]), a przekątna druga to [i, 2 - i].</text>

  <!-- Left: 3x3 Grid -->
  <rect x="24" y="66" width="310" height="184" class="card"/>
  <text x="40" y="88" class="title">Logiczna plansza [wiersz, kolumna]</text>

  <g transform="translate(56, 102)">
    <rect x="0" y="0" width="76" height="42" class="win diag"/><text x="32" y="22" class="mono">X</text><text x="22" y="36" class="coord">[0,0]</text>
    <rect x="82" y="0" width="76" height="42" class="cell"/><text x="114" y="22" class="mono">O</text><text x="104" y="36" class="coord">[0,1]</text>
    <rect x="164" y="0" width="76" height="42" class="cell"/><text x="196" y="22" class="mono">.</text><text x="186" y="36" class="coord">[0,2]</text>

    <rect x="0" y="48" width="76" height="42" class="cell"/><text x="32" y="70" class="mono">.</text><text x="22" y="84" class="coord">[1,0]</text>
    <rect x="82" y="48" width="76" height="42" class="win diag"/><text x="114" y="70" class="mono">X</text><text x="104" y="84" class="coord">[1,1]</text>
    <rect x="164" y="48" width="76" height="42" class="cell"/><text x="196" y="70" class="mono">O</text><text x="186" y="84" class="coord">[1,2]</text>

    <rect x="0" y="96" width="76" height="42" class="cell"/><text x="32" y="118" class="mono">.</text><text x="22" y="132" class="coord">[2,0]</text>
    <rect x="82" y="96" width="76" height="42" class="cell"/><text x="114" y="118" class="mono">.</text><text x="104" y="132" class="coord">[2,1]</text>
    <rect x="164" y="96" width="76" height="42" class="win diag"/><text x="196" y="118" class="mono">X</text><text x="186" y="132" class="coord">[2,2]</text>
  </g>

  <!-- Right: Flat Row-Major RAM -->
  <rect x="352" y="66" width="464" height="184" class="card"/>
  <text x="368" y="88" class="title">Pamięć RAM jest zawsze jednowymiarowa (Row-Major)</text>
  <text x="368" y="108" class="sub">Wzór indeksu w płaskiej pamięci: offset = wiersz * 3 + kolumna</text>

  <g transform="translate(368, 128)">
    <rect x="0" y="0" width="44" height="44" class="win"/><text x="17" y="27" class="mono">X</text><text x="6" y="58" class="coord">0,0</text>
    <rect x="48" y="0" width="44" height="44" class="cell"/><text x="65" y="27" class="mono">O</text><text x="54" y="58" class="coord">0,1</text>
    <rect x="96" y="0" width="44" height="44" class="cell"/><text x="113" y="27" class="mono">.</text><text x="102" y="58" class="coord">0,2</text>

    <rect x="148" y="0" width="44" height="44" class="cell"/><text x="165" y="27" class="mono">.</text><text x="154" y="58" class="coord">1,0</text>
    <rect x="196" y="0" width="44" height="44" class="win"/><text x="213" y="27" class="mono">X</text><text x="202" y="58" class="coord">1,1</text>
    <rect x="244" y="0" width="44" height="44" class="cell"/><text x="261" y="27" class="mono">O</text><text x="250" y="58" class="coord">1,2</text>

    <rect x="296" y="0" width="44" height="44" class="cell"/><text x="313" y="27" class="mono">.</text><text x="302" y="58" class="coord">2,0</text>
    <rect x="344" y="0" width="44" height="44" class="cell"/><text x="361" y="27" class="mono">.</text><text x="350" y="58" class="coord">2,1</text>
    <rect x="392" y="0" width="44" height="44" class="win"/><text x="409" y="27" class="mono">X</text><text x="398" y="58" class="coord">2,2</text>
  </g>
  <text x="368" y="224" class="sub">Iteruj ZAWSZE najpierw po wierszach (r), potem po kolumnach (c) — maksymalna wydajność CPU Cache!</text>
</svg>

