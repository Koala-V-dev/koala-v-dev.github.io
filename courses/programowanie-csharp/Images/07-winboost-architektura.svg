<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 265" role="img" aria-labelledby="t72 d72">
  <title id="t72">Architektura WinBoostTray.exe: zasobnik systemowy NotifyIcon i 3 moduły systemowe Windows 11</title>
  <desc id="d72">Schemat aplikacji WinBoostTray.exe: ikona w zasobniku Windows 11 (NotifyIcon) spina trzy moduły bez uprawnień admina — czyszczenie RAM (EmptyWorkingSet), tryb Awake (SetThreadExecutionState) oraz szybki zrzut ekranu (CopyFromScreen).</desc>
  <style>
    .bg { fill: #0f172a; }
    .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; }
    .core { fill: #172554; stroke: #38bdf8; stroke-width: 2; rx: 8; }
    .m1 { fill: #064e3b; stroke: #34d399; stroke-width: 1.8; rx: 8; }
    .m2 { fill: #451a03; stroke: #fbbf24; stroke-width: 1.8; rx: 8; }
    .m3 { fill: #3b0764; stroke: #c084fc; stroke-width: 1.8; rx: 8; }
    .title { font: 700 14px 'Segoe UI', system-ui, sans-serif; fill: #f8fafc; }
    .sub { font: 500 12px 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; }
    .mono { font: 700 12px Consolas, monospace; fill: #f8fafc; }
  </style>
  <rect width="840" height="265" rx="14" class="bg"/>
  <text x="24" y="30" class="title">WinBoostTray.exe — kompletna aplikacja w zasobniku Windows 11 (3 moduły, zero admina)</text>
  <text x="24" y="48" class="sub">Minimalizacja chowa okno do paska zadań (NotifyIcon), a prawy klik na ikonie daje szybki dostęp do narzędzi.</text>

  <rect x="24" y="88" width="234" height="122" class="core"/>
  <text x="40" y="114" class="title">WinBoostTray.exe</text>
  <text x="40" y="138" class="mono">Form + NotifyIcon</text>
  <text x="40" y="160" class="sub">ContextMenuStrip</text>
  <text x="40" y="180" class="sub">Timer 1 s + /target:winexe</text>

  <line x1="258" y1="120" x2="314" y2="92" stroke="#34d399" stroke-width="2.2"/>
  <line x1="258" y1="149" x2="314" y2="149" stroke="#fbbf24" stroke-width="2.2"/>
  <line x1="258" y1="178" x2="314" y2="206" stroke="#c084fc" stroke-width="2.2"/>

  <rect x="314" y="68" width="502" height="48" class="m1"/>
  <text x="330" y="89" class="mono">1. MemReduct Engine (GlobalMemoryStatusEx + EmptyWorkingSet)</text>
  <text x="330" y="106" class="sub">Żywy pasek RAM i zwalnianie Working Set procesów użytkownika</text>

  <rect x="314" y="125" width="502" height="48" class="m2"/>
  <text x="330" y="146" class="mono">2. Tryb Awake (SetThreadExecutionState — jak PowerToys Awake)</text>
  <text x="330" y="163" class="sub">Blokuje wygaszanie ekranu podczas prezentacji i długich pobrań</text>

  <rect x="314" y="182" width="502" height="48" class="m3"/>
  <text x="330" y="203" class="mono">3. QuickSnap (Graphics.CopyFromScreen — mini-ShareX)</text>
  <text x="330" y="220" class="sub">Zrzut całego ekranu do PNG na Pulpit + kopiowanie do schowka</text>
</svg>

