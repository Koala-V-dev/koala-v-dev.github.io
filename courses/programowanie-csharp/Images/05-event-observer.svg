<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 265" role="img" aria-labelledby="t52 d52">
  <title id="t52">Wzorzec Obserwator (event / delegaty): jeden nadawca powiadamia wielu subskrybentów przez +=</title>
  <desc id="d52">Schemat zdarzeń C#: obiekt Timer lub Button ogłasza zdarzenie (Invoke), a wszystkie metody podpięte operatorem += wykonują się automatycznie.</desc>
  <style>
    .bg { fill: #0f172a; }
    .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; }
    .pub { fill: #451a03; stroke: #fbbf24; stroke-width: 2; rx: 8; }
    .subb { fill: #064e3b; stroke: #34d399; stroke-width: 1.6; rx: 8; }
    .title { font: 700 14px 'Segoe UI', system-ui, sans-serif; fill: #f8fafc; }
    .sub { font: 500 12px 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; }
    .mono { font: 700 12px Consolas, monospace; fill: #f8fafc; }
    @keyframes sig { 0% { stroke-dashoffset: 28; } 100% { stroke-dashoffset: 0; } }
    .ray { stroke: #fbbf24; stroke-width: 2.2; stroke-dasharray: 6 6; animation: sig 1.1s linear infinite; fill: none; }
  </style>
  <rect width="840" height="265" rx="14" class="bg"/>
  <text x="24" y="30" class="title">Delegaty i zdarzenia (event): wzorzec Nadawca → Subskrybenci (+= / -=)</text>
  <text x="24" y="48" class="sub">Przycisk ani Timer nie wiedzą, co ma się wydarzyć — tylko ogłaszają zdarzenie wszystkim zapisanym funkcjom.</text>

  <rect x="24" y="88" width="260" height="114" class="pub"/>
  <text x="40" y="114" class="title">Nadawca (Publisher)</text>
  <text x="40" y="138" class="mono">public event Action&lt;int&gt; Zmiana;</text>
  <text x="40" y="164" class="sub">Gdy nastąpi zmiana, wywołuje:</text>
  <text x="40" y="184" class="mono" fill="#fbbf24">if (Zmiana != null) Zmiana(val);</text>

  <path d="M 284 126 L 390 96" class="ray"/>
  <path d="M 284 145 L 390 145" class="ray"/>
  <path d="M 284 164 L 390 194" class="ray"/>

  <rect x="390" y="72" width="426" height="44" class="subb"/>
  <text x="406" y="99" class="mono">Subskrybent 1 (+=): Aktualizuj pasek ProgressBar</text>

  <rect x="390" y="123" width="426" height="44" class="subb"/>
  <text x="406" y="150" class="mono">Subskrybent 2 (+=): Zmień tekst etykiety Label</text>

  <rect x="390" y="174" width="426" height="44" class="subb"/>
  <text x="406" y="201" class="mono">Subskrybent 3 (+=): Zapisz wpis w logu alarmów</text>
</svg>

