<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 265" role="img" aria-labelledby="t61 d61">
  <title id="t61">Algorytm tasowania Fisher-Yates oraz maszyna stanów gry Memory Cards</title>
  <desc id="d61">Po lewej algorytm Fisher-Yates zamieniający element i z losowym indeksem j z zakresu [0..i]; po prawej czterostanowa maszyna stanów gry Memory blokująca kliknięcia w trakcie 750 ms odkrycia pary.</desc>
  <style>
    .bg { fill: #0f172a; }
    .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; }
    .st { fill: #172554; stroke: #38bdf8; stroke-width: 1.6; rx: 8; }
    .lock { fill: #451a03; stroke: #fbbf24; stroke-width: 1.8; rx: 8; }
    .win { fill: #064e3b; stroke: #34d399; stroke-width: 1.8; rx: 8; }
    .title { font: 700 14px 'Segoe UI', system-ui, sans-serif; fill: #f8fafc; }
    .sub { font: 500 12px 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; }
    .mono { font: 700 12px Consolas, monospace; fill: #f8fafc; }
    @keyframes fsmGlow { 0%, 100% { stroke-opacity: 0.45; } 50% { stroke-opacity: 1; } }
    .hl { animation: fsmGlow 2s ease-in-out infinite; }
  </style>
  <rect width="840" height="265" rx="14" class="bg"/>
  <text x="24" y="30" class="title">Silnik gry Memory Cards: tasowanie Fisher-Yates O(n) + Maszyna Stanów (FSM)</text>
  <text x="24" y="48" class="sub">Maszyna stanów uniemożliwia kliknięcie 3. karty w trakcie 750 ms oczekiwania na zakrycie nietrafionej pary.</text>

  <rect x="24" y="68" width="358" height="176" class="card"/>
  <text x="40" y="92" class="title">1. Fisher-Yates (od końca: i = n-1 → 1)</text>
  <text x="40" y="118" class="mono" fill="#38bdf8">int j = rnd.Next(0, i + 1);</text>
  <text x="40" y="140" class="mono">Swap(karty[i], karty[j]);</text>
  <text x="40" y="172" class="sub">Każda z n! permutacji ma dokładnie</text>
  <text x="40" y="190" class="sub">takie samo prawdopodobieństwo 1 / n!.</text>
  <text x="40" y="218" class="mono" fill="#34d399">Czas: O(n) | Dodatkowy RAM: O(1)</text>

  <rect x="400" y="68" width="416" height="176" class="card"/>
  <text x="416" y="92" class="title">2. Maszyna Stanów (Finite State Machine)</text>

  <rect x="416" y="106" width="176" height="44" class="st"/><text x="428" y="126" class="mono">Stan 0: Czekam</text><text x="428" y="142" class="sub">Klik → odkryj 1. kartę</text>
  <line x1="592" y1="128" x2="622" y2="128" stroke="#64748b" stroke-width="2"/>
  <rect x="622" y="106" width="178" height="44" class="st"/><text x="634" y="126" class="mono">Stan 1: 1 karta</text><text x="634" y="142" class="sub">Klik → odkryj 2. kartę</text>

  <line x1="710" y1="150" x2="710" y2="176" stroke="#fbbf24" stroke-width="2"/>
  <rect x="622" y="176" width="178" height="52" class="lock hl"/><text x="634" y="196" class="mono" fill="#fbbf24">Stan 2: BLOKADA</text><text x="634" y="214" class="sub">Timer 750 ms → zakryj</text>

  <rect x="416" y="176" width="176" height="52" class="win"/><text x="428" y="196" class="mono" fill="#34d399">Stan 3: TRAFIONA!</text><text x="428" y="214" class="sub">Zostaw odkryte; +1 para</text>
</svg>

