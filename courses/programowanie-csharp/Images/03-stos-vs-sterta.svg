<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 265" role="img" aria-labelledby="t32 d32">
  <title id="t32">Typy wartościowe na Stosie (kopia wartości) kontra typy referencyjne na Stercie (wspólny adres)</title>
  <desc id="d32">Porównanie przypisania b = a: dla int/struct powstaje niezależna kopia na stosie, natomiast dla class obie zmienne wskazują ten sam obiekt na stercie (aliasing).</desc>
  <style>
    .bg { fill: #0f172a; }
    .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; }
    .val { fill: #064e3b; stroke: #34d399; rx: 7; }
    .ref { fill: #172554; stroke: #38bdf8; rx: 7; }
    .heap { fill: #451a03; stroke: #fbbf24; stroke-width: 2; rx: 8; }
    .title { font: 700 14px 'Segoe UI', system-ui, sans-serif; fill: #f8fafc; }
    .sub { font: 500 12px 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; }
    .mono { font: 700 12px Consolas, monospace; fill: #f8fafc; }
    @keyframes warnPulse { 0%, 100% { stroke-opacity: 0.45; } 50% { stroke-opacity: 1; } }
    .hl { animation: warnPulse 2s ease-in-out infinite; }
  </style>
  <rect width="840" height="265" rx="14" class="bg"/>
  <text x="24" y="30" class="title">Przełomowy model pamięci: Value Type (kopia na Stosie) vs Reference Type (adres do Sterty)</text>
  <text x="24" y="48" class="sub">Po lewej zmiana b NIE wpływa na a. Po prawej b i a trzymają TEN SAM adres 0x7A20 (aliasing)!</text>

  <!-- Left: Value Type -->
  <rect x="24" y="66" width="340" height="178" class="card"/>
  <text x="40" y="90" class="title" fill="#34d399">Typ wartościowy (int, double, struct)</text>
  <rect x="40" y="106" width="136" height="48" class="val"/>
  <text x="52" y="126" class="mono">int a = 100</text>
  <text x="52" y="144" class="sub">Stos (niezależny)</text>

  <rect x="204" y="106" width="144" height="48" class="val"/>
  <text x="216" y="126" class="mono">int b = a; b = 50</text>
  <text x="216" y="144" class="sub">Osobna kopia!</text>

  <text x="40" y="188" class="mono">Wynik: a == 100, b == 50</text>
  <text x="40" y="210" class="sub">Brak efektów ubocznych.</text>

  <!-- Right: Reference Type -->
  <rect x="382" y="66" width="434" height="178" class="card"/>
  <text x="398" y="90" class="title" fill="#fbbf24">Typ referencyjny (class, List, tablica)</text>

  <rect x="398" y="106" width="150" height="38" class="ref"/>
  <text x="410" y="130" class="mono">a → 0x7A20</text>

  <rect x="398" y="156" width="150" height="38" class="ref"/>
  <text x="410" y="180" class="mono">b → 0x7A20</text>

  <line x1="548" y1="125" x2="612" y2="146" stroke="#fbbf24" stroke-width="2.2"/>
  <line x1="548" y1="175" x2="612" y2="156" stroke="#fbbf24" stroke-width="2.2"/>

  <rect x="612" y="114" width="188" height="74" class="heap hl"/>
  <text x="624" y="136" class="mono">Sterta @ 0x7A20</text>
  <text x="624" y="156" class="mono" fill="#fbbf24">Gracz.Hp = 50</text>
  <text x="624" y="176" class="sub">JEDEN obiekt w RAM!</text>

  <text x="398" y="220" class="mono" fill="#f87171">b.Hp = 50 zmienia również a.Hp na 50!</text>
</svg>

