<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 265" role="img" aria-labelledby="t41 d41">
  <title id="t41">Generyczny Bufor Cykliczny BuforCykliczny&lt;T&gt; (Ring Buffer) z nadpisywaniem najstarszych próbek</title>
  <desc id="d41">Schemat działania bufora cyklicznego o stałym rozmiarze 4 dla dowolnego typu T: po zapełnieniu wskaźnik zapisu zawija się przez modulo na indeks 0, nadpisując najstarszą próbkę bez alokacji RAM.</desc>
  <style>
    .bg { fill: #0f172a; }
    .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; }
    .slot { fill: #0f172a; stroke: #38bdf8; stroke-width: 1.6; rx: 8; }
    .head { fill: #064e3b; stroke: #34d399; stroke-width: 2.2; rx: 8; }
    .title { font: 700 14px 'Segoe UI', system-ui, sans-serif; fill: #f8fafc; }
    .sub { font: 500 12px 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; }
    .mono { font: 700 12px Consolas, monospace; fill: #f8fafc; }
    @keyframes ringMove { 0%, 24% { transform: translateX(0); } 25%, 49% { transform: translateX(132px); } 50%, 74% { transform: translateX(264px); } 75%, 100% { transform: translateX(396px); } }
    .marker { animation: ringMove 4s steps(1) infinite; }
  </style>
  <rect width="840" height="265" rx="14" class="bg"/>
  <text x="24" y="30" class="title">Generyczny Ring Buffer (BuforCykliczny&lt;T&gt;) — stała pamięć O(1) dla FPS, pingu lub historii RAM</text>
  <text x="24" y="48" class="sub">Jedna klasa obsługuje BuforCykliczny&lt;double&gt;, BuforCykliczny&lt;string&gt; i BuforCykliczny&lt;RamSnapshot&gt;.</text>

  <rect x="24" y="68" width="792" height="172" class="card"/>
  <text x="40" y="94" class="title">Indeks zapisu: head = (head + 1) % pojemnosc  (zero alokacji dla GC!)</text>

  <g transform="translate(150, 118)">
    <rect x="0" y="0" width="116" height="58" class="slot"/><text x="34" y="24" class="sub">[0]</text><text x="24" y="46" class="mono">62.4%</text>
    <rect x="132" y="0" width="116" height="58" class="slot"/><text x="166" y="24" class="sub">[1]</text><text x="156" y="46" class="mono">64.1%</text>
    <rect x="264" y="0" width="116" height="58" class="slot"/><text x="298" y="24" class="sub">[2]</text><text x="288" y="46" class="mono">65.0%</text>
    <rect x="396" y="0" width="116" height="58" class="slot"/><text x="430" y="24" class="sub">[3]</text><text x="420" y="46" class="mono">61.8%</text>

    <g class="marker">
      <rect x="-2" y="-2" width="120" height="62" rx="9" fill="none" stroke="#34d399" stroke-width="2.5"/>
      <text x="28" y="84" class="mono" fill="#34d399">▲ head</text>
    </g>
  </g>
</svg>

