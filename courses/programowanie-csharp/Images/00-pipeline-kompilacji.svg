<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 270" role="img" aria-labelledby="t01 d01">
  <title id="t01">Potok kompilacji C# od kodu źródłowego do procesora x86-64 i strumieni konsoli</title>
  <desc id="d01">Schemat czterech etapów: Program.cs trafia do kompilatora csc, który generuje bajtkod CIL w pliku .exe, następnie CLR JIT kompiluje go do rozkazów maszynowych x86-64 wysyłających znaki do strumieni stdout i stderr.</desc>
  <style>
    .bg { fill: #0f172a; }
    .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; }
    .card-hl { fill: #172554; stroke: #38bdf8; stroke-width: 1.8; rx: 10; }
    .title { font: 700 14px 'Segoe UI', system-ui, sans-serif; fill: #f8fafc; }
    .sub { font: 500 12px 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; }
    .code { font: 600 11.5px Consolas, monospace; fill: #38bdf8; }
    .ok { font: 600 11.5px Consolas, monospace; fill: #34d399; }
    .err { font: 600 11.5px Consolas, monospace; fill: #f87171; }
    .arrow { stroke: #64748b; stroke-width: 2.2; fill: none; }
    .pulse { fill: #38bdf8; }
    @keyframes flow1 { 0% { transform: translateX(0); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateX(46px); opacity: 0; } }
    @keyframes glow { 0%, 100% { stroke-opacity: 0.45; } 50% { stroke-opacity: 1; } }
    .p1 { animation: flow1 2.4s linear infinite; }
    .p2 { animation: flow1 2.4s linear 0.8s infinite; }
    .p3 { animation: flow1 2.4s linear 1.6s infinite; }
    .active-box { animation: glow 2.4s ease-in-out infinite; }
  </style>
  <rect width="840" height="270" rx="14" class="bg"/>
  <text x="24" y="30" class="title">Potok wykonania programu C# (od tekstu do krzemu i konsoli)</text>
  <text x="24" y="48" class="sub">Czytaj od lewej do prawej: kod źródłowy → kompilacja do CIL → kompilacja JIT → strumienie OS</text>

  <!-- Step 1 -->
  <rect x="24" y="70" width="160" height="118" class="card"/>
  <text x="38" y="94" class="title">1. Program.cs</text>
  <text x="38" y="114" class="sub">Tekst UTF-8 (dla ludzi)</text>
  <text x="38" y="140" class="code">Console.WriteLine(</text>
  <text x="38" y="158" class="code">  "Gotowe!");</text>
  <text x="38" y="178" class="sub">Błędy: CS1002, CS0103</text>

  <!-- Arrow 1 -->
  <line x1="184" y1="129" x2="232" y2="129" class="arrow"/>
  <polygon points="232,124 242,129 232,134" fill="#64748b"/>
  <circle cx="188" cy="129" r="4" class="pulse p1"/>

  <!-- Step 2 -->
  <rect x="242" y="70" width="164" height="118" class="card-hl active-box"/>
  <text x="256" y="94" class="title">2. Kompilator csc</text>
  <text x="256" y="114" class="sub">Tworzy plik PE (.exe)</text>
  <text x="256" y="140" class="code">ldstr "Gotowe!"</text>
  <text x="256" y="158" class="code">call WriteLine</text>
  <text x="256" y="178" class="sub">Bajtkod CIL (niezależny)</text>

  <!-- Arrow 2 -->
  <line x1="406" y1="129" x2="454" y2="129" class="arrow"/>
  <polygon points="454,124 464,129 454,134" fill="#64748b"/>
  <circle cx="410" cy="129" r="4" class="pulse p2"/>

  <!-- Step 3 -->
  <rect x="464" y="70" width="160" height="118" class="card"/>
  <text x="478" y="94" class="title">3. CLR + JIT</text>
  <text x="478" y="114" class="sub">Tłumaczy w locie</text>
  <text x="478" y="140" class="code">mov rcx, [str]</text>
  <text x="478" y="158" class="code">call WriteFile</text>
  <text x="478" y="178" class="sub">Rozkazy x86-64 CPU</text>

  <!-- Arrow 3 -->
  <line x1="624" y1="129" x2="668" y2="129" class="arrow"/>
  <polygon points="668,124 678,129 668,134" fill="#64748b"/>
  <circle cx="628" cy="129" r="4" class="pulse p3"/>

  <!-- Step 4 -->
  <rect x="678" y="70" width="138" height="118" class="card"/>
  <text x="692" y="94" class="title">4. Jądro OS</text>
  <text x="692" y="114" class="sub">Strumienie procesu</text>
  <text x="692" y="140" class="ok">FD 1: stdout</text>
  <text x="692" y="158" class="err">FD 2: stderr</text>
  <text x="692" y="178" class="sub">Okno terminala</text>

  <!-- Bottom note -->
  <rect x="24" y="206" width="792" height="44" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="40" y="226" class="sub">Jeśli etap 2 (csc) wykryje błąd składni, plik .exe w ogóle NIE powstaje i etap 3 nigdy nie startuje.</text>
  <text x="40" y="242" class="code">Zasada diagnostyki: zawsze naprawiaj PIERWSZY błąd od góry (kolejne to często efekt domina).</text>
</svg>
