<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 265" role="img" aria-labelledby="t21 d21">
  <title id="t21">Dynamiczny wzrost pamięci List&lt;T&gt;: Count kontra Capacity (4 → 8)</title>
  <desc id="d21">Animowany schemat rozbudowy wewnętrznej tablicy List&lt;T&gt;: po zapełnieniu 4 slotów dodanie 5. elementu alokuje nową tablicę o rozmiarze 8 i kopiuje dane.</desc>
  <style>
    .bg { fill: #0f172a; }
    .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; }
    .used { fill: #0284c7; stroke: #38bdf8; rx: 5; }
    .free { fill: #0f172a; stroke: #475569; stroke-dasharray: 4 3; rx: 5; }
    .newcell { fill: #059669; stroke: #34d399; rx: 5; }
    .title { font: 700 14px 'Segoe UI', system-ui, sans-serif; fill: #f8fafc; }
    .sub { font: 500 12px 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; }
    .mono { font: 700 12px Consolas, monospace; fill: #f8fafc; }
    @keyframes pulseNew { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    .hl { animation: pulseNew 2s ease-in-out infinite; }
  </style>
  <rect width="840" height="265" rx="14" class="bg"/>
  <text x="24" y="30" class="title">Jak List&lt;T&gt; rośnie w pamięci RAM (podwajanie Capacity: 0 → 4 → 8 → 16)</text>
  <text x="24" y="48" class="sub">W środku List&lt;T&gt; leży zwykła tablica T[]. Count = zajęte miejsca, Capacity = rozmiar tablicy.</text>

  <rect x="24" y="66" width="792" height="80" class="card"/>
  <text x="40" y="90" class="title">Przed 5. wywołaniem .Add() — Count: 4, Capacity: 4 (PEŁNA!)</text>
  <g transform="translate(40, 102)">
    <rect x="0" y="0" width="76" height="32" class="used"/><text x="16" y="21" class="mono">a.png</text>
    <rect x="84" y="0" width="76" height="32" class="used"/><text x="100" y="21" class="mono">b.pdf</text>
    <rect x="168" y="0" width="76" height="32" class="used"/><text x="184" y="21" class="mono">c.zip</text>
    <rect x="252" y="0" width="76" height="32" class="used"/><text x="268" y="21" class="mono">d.exe</text>
    <text x="350" y="21" class="sub">Brak wolnego slotu → alokacja nowej tablicy 2× większej!</text>
  </g>

  <rect x="24" y="160" width="792" height="84" class="card"/>
  <text x="40" y="184" class="title" fill="#34d399">Po .Add("e.mp4") — Count: 5, Capacity: 8 (skopiowano 4 + dopisano 5.)</text>
  <g transform="translate(40, 198)">
    <rect x="0" y="0" width="76" height="32" class="used"/><text x="16" y="21" class="mono">a.png</text>
    <rect x="84" y="0" width="76" height="32" class="used"/><text x="100" y="21" class="mono">b.pdf</text>
    <rect x="168" y="0" width="76" height="32" class="used"/><text x="184" y="21" class="mono">c.zip</text>
    <rect x="252" y="0" width="76" height="32" class="used"/><text x="268" y="21" class="mono">d.exe</text>
    <rect x="336" y="0" width="76" height="32" class="newcell hl"/><text x="352" y="21" class="mono">e.mp4</text>
    <rect x="420" y="0" width="76" height="32" class="free"/><text x="444" y="21" class="sub">wolne</text>
    <rect x="504" y="0" width="76" height="32" class="free"/><text x="528" y="21" class="sub">wolne</text>
    <rect x="588" y="0" width="76" height="32" class="free"/><text x="612" y="21" class="sub">wolne</text>
  </g>
</svg>

