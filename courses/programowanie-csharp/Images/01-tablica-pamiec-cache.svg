<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" role="img" aria-labelledby="t12 d12">
  <title id="t12">Tablica int[] w ciągłej pamięci RAM i wyszukiwanie binarne O(log n)</title>
  <desc id="d12">Schemat ciągłego bloku pamięci RAM dla tablicy 6 elementów int (po 4 bajty każdy) wraz ze wzorem adresu base + i * 4 oraz animowanym wskaźnikiem środka w wyszukiwaniu binarnym.</desc>
  <style>
    .bg { fill: #0f172a; }
    .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; }
    .cell { fill: #0f172a; stroke: #38bdf8; stroke-width: 1.6; rx: 6; }
    .title { font: 700 14px 'Segoe UI', system-ui, sans-serif; fill: #f8fafc; }
    .sub { font: 500 12px 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; }
    .mono { font: 700 13px Consolas, monospace; fill: #f8fafc; }
    .addr { font: 600 11px Consolas, monospace; fill: #34d399; }
    @keyframes slidePtr { 0%, 30% { transform: translateX(0); } 40%, 65% { transform: translateX(220px); } 75%, 100% { transform: translateX(110px); } }
    .ptr { animation: slidePtr 3.6s ease-in-out infinite; }
  </style>
  <rect width="840" height="260" rx="14" class="bg"/>
  <text x="24" y="30" class="title">Ciągły blok pamięci RAM tablicy int[] — dlaczego dostęp tab[i] zajmuje czas O(1)</text>
  <text x="24" y="48" class="sub">Każdy element int zajmuje dokładnie 4 bajty. Procesor wylicza adres jednym mnożeniem: adres = baza + i * 4.</text>

  <rect x="24" y="68" width="792" height="168" class="card"/>

  <!-- Cells -->
  <g transform="translate(48, 108)">
    <rect x="0" y="0" width="102" height="54" class="cell"/><text x="36" y="32" class="mono">10</text><text x="16" y="-8" class="sub">indeks [0]</text><text x="16" y="72" class="addr">0x1000</text>
    <rect x="110" y="0" width="102" height="54" class="cell"/><text x="146" y="32" class="mono">24</text><text x="126" y="-8" class="sub">indeks [1]</text><text x="126" y="72" class="addr">0x1004</text>
    <rect x="220" y="0" width="102" height="54" class="cell"/><text x="256" y="32" class="mono">37</text><text x="236" y="-8" class="sub">indeks [2]</text><text x="236" y="72" class="addr">0x1008</text>
    <rect x="330" y="0" width="102" height="54" class="cell"/><text x="366" y="32" class="mono">52</text><text x="346" y="-8" class="sub">indeks [3]</text><text x="346" y="72" class="addr">0x100C</text>
    <rect x="440" y="0" width="102" height="54" class="cell"/><text x="476" y="32" class="mono">68</text><text x="456" y="-8" class="sub">indeks [4]</text><text x="456" y="72" class="addr">0x1010</text>
    <rect x="550" y="0" width="102" height="54" class="cell"/><text x="586" y="32" class="mono">91</text><text x="566" y="-8" class="sub">indeks [5]</text><text x="566" y="72" class="addr">0x1014</text>

    <!-- Animated pointer -->
    <g class="ptr">
      <rect x="218" y="-2" width="106" height="58" rx="7" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="234" y="96" class="mono" fill="#fbbf24">srodek</text>
    </g>
  </g>
</svg>

