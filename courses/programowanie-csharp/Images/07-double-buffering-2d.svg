<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 265" role="img" aria-labelledby="t71 d71">
  <title id="t71">Podwójne buforowanie (Double Buffering) w grafice 2D i układ współrzędnych ekranu</title>
  <desc id="d71">Schemat działania DoubleBuffered: klatka gry rysowana jest w niewidocznym buforze tylnym (Back Buffer), a potem w jednym skoku kopiowana na ekran (Front Buffer), eliminując migotanie.</desc>
  <style>
    .bg { fill: #0f172a; }
    .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; }
    .buf { fill: #0f172a; stroke: #38bdf8; stroke-width: 1.8; rx: 8; }
    .scr { fill: #064e3b; stroke: #34d399; stroke-width: 1.8; rx: 8; }
    .title { font: 700 14px 'Segoe UI', system-ui, sans-serif; fill: #f8fafc; }
    .sub { font: 500 12px 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; }
    .mono { font: 700 12px Consolas, monospace; fill: #f8fafc; }
    @keyframes swapBuf { 0% { stroke-dashoffset: 32; } 100% { stroke-dashoffset: 0; } }
    .swap { stroke: #34d399; stroke-width: 2.6; stroke-dasharray: 6 6; animation: swapBuf 1.1s linear infinite; fill: none; }
  </style>
  <rect width="840" height="265" rx="14" class="bg"/>
  <text x="24" y="30" class="title">Grafika 2D w C#: Układ współrzędnych ekranu (Y w dół!) oraz Double Buffering (zero migotania)</text>
  <text x="24" y="48" class="sub">Bez DoubleBuffered = true oko widzi czyszczenie tła przed narysowaniem węża. Back Buffer eliminuje migotanie.</text>

  <rect x="24" y="68" width="240" height="174" class="card"/>
  <text x="40" y="92" class="title">1. Układ ekranu (px)</text>
  <circle cx="54" cy="116" r="4" fill="#fbbf24"/>
  <text x="64" y="120" class="mono">(0, 0) lewy górny róg</text>
  <line x1="54" y1="116" x2="210" y2="116" stroke="#38bdf8" stroke-width="2"/>
  <text x="150" y="136" class="mono" fill="#38bdf8">X rośnie →</text>
  <line x1="54" y1="116" x2="54" y2="218" stroke="#34d399" stroke-width="2"/>
  <text x="66" y="198" class="mono" fill="#34d399">Y rośnie ↓</text>

  <rect x="284" y="68" width="234" height="174" class="buf"/>
  <text x="300" y="94" class="title">2. Back Buffer (w RAM)</text>
  <text x="300" y="118" class="sub">Niewidoczny dla użytkownika</text>
  <text x="300" y="144" class="mono">1. Wyczyść tło</text>
  <text x="300" y="164" class="mono">2. Narysuj jedzenie</text>
  <text x="300" y="184" class="mono">3. Narysuj węża</text>
  <text x="300" y="218" class="mono" fill="#38bdf8">OnPaint(e.Graphics)</text>

  <path d="M 518 154 L 580 154" class="swap"/>
  <polygon points="580,149 590,154 580,159" fill="#34d399"/>

  <rect x="590" y="68" width="226" height="174" class="scr"/>
  <text x="606" y="94" class="title">3. Front Buffer (Ekran)</text>
  <text x="606" y="118" class="sub">Błyskawiczna podmiana</text>
  <text x="606" y="148" class="mono">Gotowa klatka 100%</text>
  <text x="606" y="170" class="sub">Zero migotania (flicker)!</text>
  <text x="606" y="218" class="mono" fill="#34d399">DoubleBuffered = true;</text>
</svg>

