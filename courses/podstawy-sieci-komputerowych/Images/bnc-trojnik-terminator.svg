<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect x="20" y="20" width="600" height="180" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="10"/>

  <text x="40" y="48" font-family="system-ui, sans-serif" font-size="16px" font-weight="700" fill="#38bdf8">Osprzęt magistrali 10BASE2: Trójnik BNC i Terminator 50 Ω</text>
  <text x="40" y="68" font-family="system-ui, sans-serif" font-size="12px" fill="#94a3b8">Fizyczne zakończenie ostatniej stacji na końcu kabla koncentrycznego</text>

  <!-- Karta sieciowa (NIC) na dole -->
  <rect x="240" y="145" width="160" height="36" fill="#0f172a" stroke="#64748b" stroke-width="2" rx="6"/>
  <text x="320" y="168" font-family="monospace" font-size="12px" font-weight="700" fill="#e2e8f0" text-anchor="middle">Karta sieciowa (NIC)</text>

  <!-- Pionowa nóżka trójnika BNC do karty -->
  <rect x="306" y="120" width="28" height="25" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="302" y="138" width="36" height="7" fill="#64748b" rx="2"/>

  <!-- Pozioma część trójnika BNC -->
  <rect x="255" y="96" width="130" height="26" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1.5" rx="4"/>
  <text x="320" y="113" font-family="monospace" font-size="11px" font-weight="800" fill="#0f172a" text-anchor="middle">TRÓJNIK BNC</text>

  <!-- Kabel koncentryczny z lewej strony -->
  <line x1="65" y1="109" x2="235" y2="109" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
  <line x1="65" y1="109" x2="235" y2="109" stroke="#475569" stroke-width="6"/>
  <!-- Wtyk BNC na kablu -->
  <rect x="230" y="99" width="25" height="20" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5" rx="2"/>
  <text x="145" y="92" font-family="system-ui, sans-serif" font-size="11px" font-weight="700" fill="#38bdf8" text-anchor="middle">Kabel koncentryczny (RG-58)</text>
  <text x="145" y="132" font-family="system-ui, sans-serif" font-size="10px" fill="#94a3b8" text-anchor="middle">← Do poprzedniej stacji</text>

  <!-- Terminator 50 Ohm z prawej strony -->
  <rect x="385" y="98" width="66" height="22" fill="#b45309" stroke="#fbbf24" stroke-width="2" rx="4"/>
  <text x="418" y="113" font-family="monospace" font-size="11px" font-weight="800" fill="#ffffff" text-anchor="middle">50 Ω</text>
  <text x="495" y="106" font-family="system-ui, sans-serif" font-size="12px" font-weight="700" fill="#fbbf24" text-anchor="start">Terminator</text>
  <text x="495" y="122" font-family="system-ui, sans-serif" font-size="10px" fill="#cbd5e1" text-anchor="start">Pochłania falę sygnału</text>
</svg>
