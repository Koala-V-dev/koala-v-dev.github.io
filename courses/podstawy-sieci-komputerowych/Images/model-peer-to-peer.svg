<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect x="20" y="20" width="600" height="180" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="10"/>

  <text x="40" y="48" font-family="system-ui, sans-serif" font-size="16px" font-weight="700" fill="#34d399">Architektura Równorzędna (Peer-to-Peer – P2P)</text>
  <text x="40" y="68" font-family="system-ui, sans-serif" font-size="12px" fill="#94a3b8">Brak centralnego serwera – każdy węzeł jednocześnie pobiera i udostępnia fragmenty</text>

  <!-- Siatka połączeń P2P -->
  <line x1="160" y1="110" x2="320" y2="100" stroke="#10b981" stroke-width="2"/>
  <line x1="320" y1="100" x2="480" y2="110" stroke="#10b981" stroke-width="2"/>
  <line x1="480" y1="110" x2="380" y2="160" stroke="#10b981" stroke-width="2"/>
  <line x1="380" y1="160" x2="260" y2="160" stroke="#10b981" stroke-width="2"/>
  <line x1="260" y1="160" x2="160" y2="110" stroke="#10b981" stroke-width="2"/>
  <line x1="160" y1="110" x2="380" y2="160" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 2"/>
  <line x1="480" y1="110" x2="260" y2="160" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- Węzły Peer -->
  <g transform="translate(110, 95)"><rect width="90" height="30" fill="#064e3b" stroke="#10b981" stroke-width="1.5" rx="6"/><text x="45" y="20" font-family="system-ui, sans-serif" font-size="11px" font-weight="700" fill="#fff" text-anchor="middle">Węzeł A</text></g>
  <g transform="translate(275, 85)"><rect width="90" height="30" fill="#064e3b" stroke="#10b981" stroke-width="1.5" rx="6"/><text x="45" y="20" font-family="system-ui, sans-serif" font-size="11px" font-weight="700" fill="#fff" text-anchor="middle">Węzeł B</text></g>
  <g transform="translate(435, 95)"><rect width="90" height="30" fill="#064e3b" stroke="#10b981" stroke-width="1.5" rx="6"/><text x="45" y="20" font-family="system-ui, sans-serif" font-size="11px" font-weight="700" fill="#fff" text-anchor="middle">Węzeł C</text></g>
  <g transform="translate(215, 145)"><rect width="90" height="30" fill="#064e3b" stroke="#10b981" stroke-width="1.5" rx="6"/><text x="45" y="20" font-family="system-ui, sans-serif" font-size="11px" font-weight="700" fill="#fff" text-anchor="middle">Węzeł D</text></g>
  <g transform="translate(335, 145)"><rect width="90" height="30" fill="#064e3b" stroke="#10b981" stroke-width="1.5" rx="6"/><text x="45" y="20" font-family="system-ui, sans-serif" font-size="11px" font-weight="700" fill="#fff" text-anchor="middle">Węzeł E</text></g>

  <text x="320" y="190" font-family="system-ui, sans-serif" font-size="11px" fill="#34d399" text-anchor="middle">✅ Rój stacji (Swarm): awaria dowolnego komputera nie przerywa działania sieci</text>
</svg>
