<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 285" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
      .lbl-title { font-family: system-ui, sans-serif; font-size: 11.5px; font-weight: 700; }
      .lbl-sub { font-family: system-ui, sans-serif; font-size: 10px; fill: #94a3b8; }
      .badge-txt { font-family: monospace; font-size: 14px; font-weight: 800; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <text x="35" y="30" class="title">Anatomia skrętki: Jak czytać oznaczenie xx / y TP</text>
  <text x="35" y="48" class="subtitle">Teleskopowy przekrój kabla – od powłoki zewnętrznej po 4 skręcone pary miedziane</text>

  <!-- ================= TELESKOPOWY PRZEKRÓJ KABLA ================= -->

  <!-- 1. Płaszcz zewnętrzny (PVC/LSZH) -->
  <g transform="translate(35, 75)">
    <rect width="125" height="125" rx="8" fill="#334155" stroke="#475569" stroke-width="2"/>
    <text x="62" y="55" class="lbl-title" fill="#f8fafc" text-anchor="middle">1. Płaszcz</text>
    <text x="62" y="72" class="lbl-sub" text-anchor="middle">zewnętrzny</text>
    <text x="62" y="90" font-family="monospace" font-size="9.5px" fill="#cbd5e1" text-anchor="middle">PVC / LSZH</text>
  </g>

  <!-- Biały sznurek Ripcord (do rozpruwania płaszcza) -->
  <path d="M 160 82 Q 185 60 215 65" stroke="#f8fafc" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="215" cy="65" r="3" fill="#f8fafc"/>
  <text x="225" y="68" font-family="system-ui, sans-serif" font-size="9.5px" font-weight="700" fill="#f8fafc">Biały sznurek (Ripcord) – do prucia płaszcza</text>

  <!-- 2. Ekran ogólny kabla (xx) -->
  <g transform="translate(160, 90)">
    <rect width="125" height="98" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="25" y="8" width="75" height="24" rx="4" fill="#0284c7" fill-opacity="0.3"/>
    <text x="62" y="25" class="badge-txt" fill="#38bdf8" text-anchor="middle">xx</text>
    <text x="62" y="52" class="lbl-title" fill="#38bdf8" text-anchor="middle">2. Ekran ogólny</text>
    <text x="62" y="68" class="lbl-sub" text-anchor="middle">całego kabla</text>
    <text x="62" y="84" font-family="monospace" font-size="9px" fill="#7dd3fc" text-anchor="middle">U / F / S / SF</text>
  </g>

  <!-- Żyła uziemiająca (Drain wire) wybiegająca spod ekranu - metalowy drucik -->
  <path d="M 285 105 L 340 85" stroke="#d97706" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="340" cy="85" r="3" fill="#f59e0b"/>
  <text x="350" y="88" font-family="system-ui, sans-serif" font-size="10px" font-weight="700" fill="#fbbf24">Żyła uziemiająca (Drain wire – miedź!)</text>

  <!-- Krzyżak (Spline) - separator par -->
  <g transform="translate(285, 120)">
    <line x1="25" y1="10" x2="25" y2="45" stroke="#f59e0b" stroke-width="3.5"/>
    <line x1="8" y1="27" x2="42" y2="27" stroke="#f59e0b" stroke-width="3.5"/>
    <text x="25" y="60" font-family="system-ui, sans-serif" font-size="8.5px" font-weight="700" fill="#f59e0b" text-anchor="middle">Krzyżak (Spline)</text>
  </g>

  <!-- 3. Ekran pojedynczych par (y) -->
  <g transform="translate(350, 100)">
    <rect width="130" height="82" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <rect x="30" y="6" width="70" height="22" rx="4" fill="#059669" fill-opacity="0.3"/>
    <text x="65" y="22" class="badge-txt" fill="#34d399" text-anchor="middle">y</text>
    <text x="65" y="47" class="lbl-title" fill="#34d399" text-anchor="middle">3. Ekran par</text>
    <text x="65" y="62" class="lbl-sub" text-anchor="middle">osobne folie</text>
    <text x="65" y="74" font-family="monospace" font-size="9px" fill="#86efac" text-anchor="middle">U (brak) / F (folia)</text>
  </g>

  <!-- 4. Cztery rzeczywiste pary miedziane (TP) -->
  <g transform="translate(485, 75)">
    <!-- Para 1: Pomarańczowa -->
    <g transform="translate(30, 10)">
      <circle cx="15" cy="12" r="7.5" fill="#ea580c" stroke="#fdba74" stroke-width="2"/>
      <circle cx="30" cy="12" r="7.5" fill="#fdba74" stroke="#ea580c" stroke-width="1.5"/>
      <text x="50" y="16" font-family="system-ui, sans-serif" font-size="11px" font-weight="700" fill="#fb923c">Para Pomarańczowa</text>
    </g>

    <!-- Para 2: Zielona -->
    <g transform="translate(30, 42)">
      <circle cx="15" cy="12" r="7.5" fill="#16a34a" stroke="#86efac" stroke-width="2"/>
      <circle cx="30" cy="12" r="7.5" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>
      <text x="50" y="16" font-family="system-ui, sans-serif" font-size="11px" font-weight="700" fill="#4ade80">Para Zielona</text>
    </g>

    <!-- Para 3: Niebieska -->
    <g transform="translate(30, 74)">
      <circle cx="15" cy="12" r="7.5" fill="#2563eb" stroke="#93c5fd" stroke-width="2"/>
      <circle cx="30" cy="12" r="7.5" fill="#93c5fd" stroke="#2563eb" stroke-width="1.5"/>
      <text x="50" y="16" font-family="system-ui, sans-serif" font-size="11px" font-weight="700" fill="#60a5fa">Para Niebieska</text>
    </g>

    <!-- Para 4: Brązowa -->
    <g transform="translate(30, 106)">
      <circle cx="15" cy="12" r="7.5" fill="#78350f" stroke="#d97706" stroke-width="2"/>
      <circle cx="30" cy="12" r="7.5" fill="#d97706" stroke="#78350f" stroke-width="1.5"/>
      <text x="50" y="16" font-family="system-ui, sans-serif" font-size="11px" font-weight="700" fill="#d97706">Para Brązowa</text>
    </g>
  </g>

  <!-- Pasek formuły na dole -->
  <g transform="translate(35, 222)">
    <rect width="670" height="42" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="6"/>
    <text x="25" y="26" font-family="system-ui, sans-serif" font-size="12px" font-weight="700" fill="#cbd5e1">Wzór:</text>
    <text x="75" y="27" font-family="monospace" font-size="16px" font-weight="800" fill="#38bdf8">xx</text>
    <text x="105" y="26" font-family="system-ui, sans-serif" font-size="11px" fill="#94a3b8">(ekran całego kabla)</text>
    <text x="245" y="27" font-family="monospace" font-size="16px" font-weight="800" fill="#64748b">/</text>
    <text x="265" y="27" font-family="monospace" font-size="16px" font-weight="800" fill="#34d399">y</text>
    <text x="285" y="26" font-family="system-ui, sans-serif" font-size="11px" fill="#94a3b8">(ekran pojedynczych par)</text>
    <text x="450" y="27" font-family="monospace" font-size="16px" font-weight="800" fill="#f8fafc">TP</text>
    <text x="480" y="26" font-family="system-ui, sans-serif" font-size="11px" fill="#cbd5e1">(Twisted Pair – 4 pary skręcone)</text>
  </g>
</svg>
