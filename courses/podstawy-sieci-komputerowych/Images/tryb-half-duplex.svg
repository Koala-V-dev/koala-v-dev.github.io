<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect x="20" y="20" width="600" height="160" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" rx="10"/>

  <text x="40" y="48" font-family="system-ui, sans-serif" font-size="16px" font-weight="700" fill="#fbbf24">Tryb Half-Duplex: Ruch wahadłowy (Roboty drogowe)</text>
  <text x="40" y="68" font-family="system-ui, sans-serif" font-size="12px" fill="#94a3b8">Komunikacja w obu kierunkach, ale NIE JEDNOCZEŚNIE. Ryzyko zderzenia czołowego!</text>

  <!-- Droga z przewężeniem -->
  <g transform="translate(40, 85)">
    <rect width="520" height="75" fill="#0f172a" rx="6" stroke="#334155" stroke-width="1"/>

    <!-- Sygnalizator A (Zielone) -->
    <g transform="translate(20, 15)">
      <rect width="18" height="42" fill="#1e293b" stroke="#475569" rx="3"/>
      <circle cx="9" cy="10" r="4" fill="#ef4444" opacity="0.3"/>
      <circle cx="9" cy="21" r="4" fill="#f59e0b" opacity="0.3"/>
      <circle cx="9" cy="32" r="4" fill="#22c55e"/>
    </g>

    <!-- Samochód A na zwężeniu -->
    <g transform="translate(80, 24)">
      <rect width="70" height="26" fill="#38bdf8" rx="4"/>
      <text x="35" y="17" font-family="monospace" font-size="10px" font-weight="700" fill="#0f172a" text-anchor="middle">Host A ►</text>
    </g>

    <!-- Pachołki / Roboty drogowe na środku -->
    <g transform="translate(190, 8)">
      <rect width="140" height="25" fill="#451a03" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 2" rx="4"/>
      <text x="70" y="17" font-family="sans-serif" font-size="10px" font-weight="700" fill="#fbbf24" text-anchor="middle">🚧 JEDEN PAS RUCHU 🚧</text>
    </g>

    <!-- Samochód B czeka na czerwonym świetle -->
    <g transform="translate(370, 24)">
      <rect width="70" height="26" fill="#ef4444" opacity="0.8" rx="4"/>
      <text x="35" y="17" font-family="monospace" font-size="10px" font-weight="700" fill="#fff" text-anchor="middle">◄ Czeka B</text>
    </g>

    <!-- Sygnalizator B (Czerwone) -->
    <g transform="translate(480, 15)">
      <rect width="18" height="42" fill="#1e293b" stroke="#475569" rx="3"/>
      <circle cx="9" cy="10" r="4" fill="#ef4444"/>
      <circle cx="9" cy="21" r="4" fill="#f59e0b" opacity="0.3"/>
      <circle cx="9" cy="32" r="4" fill="#22c55e" opacity="0.3"/>
    </g>
  </g>
</svg>
