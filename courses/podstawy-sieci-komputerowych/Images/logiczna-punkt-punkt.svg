<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect x="20" y="20" width="600" height="160" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="10"/>

  <text x="40" y="50" font-family="system-ui, sans-serif" font-size="16px" font-weight="700" fill="#38bdf8">Topologia logiczna: Punkt-Punkt (Point-to-Point)</text>
  <text x="40" y="70" font-family="system-ui, sans-serif" font-size="12px" fill="#94a3b8">Dedykowany kanał logiczny wyłącznie między dwoma stacjami</text>

  <!-- Łącze -->
  <line x1="160" y1="125" x2="480" y2="125" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="320" cy="125" r="16" fill="#0284c7"/>
  <text x="320" y="130" font-family="sans-serif" font-size="14px" fill="#fff" text-anchor="middle">⇄</text>

  <!-- Host A -->
  <g transform="translate(60, 95)">
    <rect width="100" height="60" fill="#0f172a" stroke="#38bdf8" stroke-width="2" rx="8"/>
    <text x="50" y="32" font-family="system-ui, sans-serif" font-size="14px" font-weight="700" fill="#f8fafc" text-anchor="middle">Host A</text>
    <text x="50" y="48" font-family="monospace" font-size="10px" fill="#94a3b8" text-anchor="middle">Nadawca</text>
  </g>

  <!-- Host B -->
  <g transform="translate(480, 95)">
    <rect width="100" height="60" fill="#0f172a" stroke="#38bdf8" stroke-width="2" rx="8"/>
    <text x="50" y="32" font-family="system-ui, sans-serif" font-size="14px" font-weight="700" fill="#f8fafc" text-anchor="middle">Host B</text>
    <text x="50" y="48" font-family="monospace" font-size="10px" fill="#94a3b8" text-anchor="middle">Odbiorca</text>
  </g>
</svg>
