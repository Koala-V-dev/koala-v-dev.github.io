<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 210" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .hdr { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #f8fafc; }
      .card-name { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 800; }
      .spec { font-family: monospace; font-size: 11px; font-weight: 700; }
      .desc { font-family: system-ui, sans-serif; font-size: 10px; fill: #cbd5e1; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <text x="30" y="32" class="hdr">Kodowanie kolorami powłok światłowodów w serwerowni</text>

  <!-- 1. Żółty - SMF -->
  <g transform="translate(30, 55)">
    <rect width="145" height="130" fill="#1e293b" stroke="#eab308" stroke-width="2" rx="8"/>
    <!-- Próbnik kabla żółtego -->
    <rect x="20" y="18" width="105" height="16" fill="#eab308" rx="8"/>
    <text x="72" y="55" class="card-name" fill="#facc15" text-anchor="middle">ŻÓŁTY (SMF)</text>
    <text x="72" y="74" class="spec" fill="#38bdf8" text-anchor="middle">OS1 / OS2 (9 µm)</text>
    <text x="72" y="100" class="desc" text-anchor="middle">Jednomodowy</text>
    <text x="72" y="115" class="desc" text-anchor="middle">Zasięg: 10 – 80+ km</text>
  </g>

  <!-- 2. Turkusowy - OM3 -->
  <g transform="translate(190, 55)">
    <rect width="145" height="130" fill="#1e293b" stroke="#06b6d4" stroke-width="2" rx="8"/>
    <!-- Próbnik kabla aqua -->
    <rect x="20" y="18" width="105" height="16" fill="#06b6d4" rx="8"/>
    <text x="72" y="55" class="card-name" fill="#22d3ee" text-anchor="middle">AQUA (OM3)</text>
    <text x="72" y="74" class="spec" fill="#22d3ee" text-anchor="middle">MMF (50 µm)</text>
    <text x="72" y="100" class="desc" text-anchor="middle">Laser VCSEL</text>
    <text x="72" y="115" class="desc" text-anchor="middle">10G do 300 m (RACK)</text>
  </g>

  <!-- 3. Fioletowy - OM4 -->
  <g transform="translate(350, 55)">
    <rect width="145" height="130" fill="#1e293b" stroke="#a855f7" stroke-width="2" rx="8"/>
    <!-- Próbnik kabla fioletowego -->
    <rect x="20" y="18" width="105" height="16" fill="#a855f7" rx="8"/>
    <text x="72" y="55" class="card-name" fill="#c084fc" text-anchor="middle">FIOLET (OM4)</text>
    <text x="72" y="74" class="spec" fill="#c084fc" text-anchor="middle">MMF (50 µm)</text>
    <text x="72" y="100" class="desc" text-anchor="middle">10G do 550 m</text>
    <text x="72" y="115" class="desc" text-anchor="middle">40G / 100G do 150 m</text>
  </g>

  <!-- 4. Limonkowy - OM5 -->
  <g transform="translate(510, 55)">
    <rect width="140" height="130" fill="#1e293b" stroke="#84cc16" stroke-width="2" rx="8"/>
    <!-- Próbnik kabla limonkowego -->
    <rect x="20" y="18" width="100" height="16" fill="#84cc16" rx="8"/>
    <text x="70" y="55" class="card-name" fill="#a3e635" text-anchor="middle">LIME (OM5)</text>
    <text x="70" y="74" class="spec" fill="#a3e635" text-anchor="middle">Szerokopasmowy</text>
    <text x="70" y="100" class="desc" text-anchor="middle">4 fale (SWDM4)</text>
    <text x="70" y="115" class="desc" text-anchor="middle">Do 400G Data Center</text>
  </g>
</svg>
