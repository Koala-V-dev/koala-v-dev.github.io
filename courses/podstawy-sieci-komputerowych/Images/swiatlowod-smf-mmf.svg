<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 800; fill: #f8fafc; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #94a3b8; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .card-title { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #f8fafc; }
      .card-sub { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; }
      .cladding { fill: #0f172a; stroke: #475569; stroke-width: 1.5; rx: 6; }
      .chip { fill: #0f172a; stroke: #475569; stroke-width: 1.5; rx: 6; }
      .chip-title { font-family: monospace; font-size: 15px; font-weight: 800; text-anchor: middle; }
      .chip-sub { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; text-anchor: middle; }
    </style>
  </defs>

  <rect width="840" height="380" class="bg"/>

  <text x="40" y="42" class="title">Włókna światłowodowe: SMF vs MMF</text>
  <text x="40" y="66" class="subtitle">Propagacja fali świetlnej w rdzeniu ze szkła kwarcowego</text>

  <!-- ================= SMF ================= -->
  <g transform="translate(40, 85)">
    <rect width="360" height="175" class="card" stroke="#0284c7" stroke-width="2"/>
    <text x="20" y="28" class="card-title" fill="#38bdf8">Światłowód Jednomodowy (SMF)</text>
    <text x="20" y="48" class="card-sub" fill="#7dd3fc">Laser • Rdzeń 9 µm • Dystans do 40 km</text>

    <!-- Przekrój włókna SMF -->
    <g transform="translate(20, 65)">
      <rect width="320" height="45" class="cladding"/>
      <!-- Rdzeń 9 µm (cienki pasek w osi) -->
      <rect x="0" y="20" width="320" height="5" fill="#0369a1"/>
      <!-- Promień lasera -->
      <line x1="0" y1="22.5" x2="320" y2="22.5" stroke="#38bdf8" stroke-width="2.5"/>
    </g>

    <text x="20" y="145" font-family="system-ui, sans-serif" font-size="12px" fill="#cbd5e1">Jedna wiązka w osi rdzenia. Zero dyspersji modalnej.</text>
  </g>

  <!-- ================= MMF ================= -->
  <g transform="translate(440, 85)">
    <rect width="360" height="175" class="card" stroke="#7c3aed" stroke-width="2"/>
    <text x="20" y="28" class="card-title" fill="#c084fc">Światłowód Wielomodowy (MMF)</text>
    <text x="20" y="48" class="card-sub" fill="#d8b4fe">LED/VCSEL • Rdzeń 50 µm • Dystans do 550 m</text>

    <!-- Przekrój włókna MMF -->
    <g transform="translate(20, 65)">
      <rect width="320" height="45" class="cladding"/>
      <!-- Rdzeń 50 µm (szeroki obszar) -->
      <rect x="0" y="8" width="320" height="29" fill="#581c87" fill-opacity="0.4"/>
      <!-- Promienie odbijające się zygzakiem -->
      <path d="M 0 22 L 35 10 L 70 35 L 105 10 L 140 35 L 175 10 L 210 35 L 245 10 L 280 35 L 320 22" stroke="#c084fc" stroke-width="2" fill="none"/>
      <path d="M 0 22 L 55 35 L 110 10 L 165 35 L 220 10 L 275 35 L 320 22" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="4 2" fill="none"/>
    </g>

    <text x="20" y="145" font-family="system-ui, sans-serif" font-size="12px" fill="#cbd5e1">Wiele promieni odbija się pod różnymi kątami (dyspersja).</text>
  </g>

  <!-- ================= ZŁĄCZA NA DOLE ================= -->
  <g transform="translate(40, 280)">
    <rect width="760" height="75" class="card"/>
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="13px" font-weight="700" fill="#f8fafc">Popularne złącza światłowodowe:</text>

    <g transform="translate(20, 36)">
      <!-- LC -->
      <g transform="translate(0, 0)">
        <rect width="225" height="28" class="chip"/>
        <text x="35" y="19" class="chip-title" fill="#38bdf8">LC</text>
        <text x="125" y="18" class="chip-sub">Małe zatrzaskowe (SFP / SFP+)</text>
      </g>

      <!-- SC -->
      <g transform="translate(245, 0)">
        <rect width="225" height="28" class="chip"/>
        <text x="35" y="19" class="chip-title" fill="#34d399">SC</text>
        <text x="125" y="18" class="chip-sub">Kwadratowe Push-Pull (Abonent)</text>
      </g>

      <!-- ST -->
      <g transform="translate(490, 0)">
        <rect width="225" height="28" class="chip"/>
        <text x="35" y="19" class="chip-title" fill="#fbbf24">ST</text>
        <text x="125" y="18" class="chip-sub">Okrągłe bagnetowe (Starsze)</text>
      </g>
    </g>
  </g>
</svg>
