<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect x="20" y="20" width="600" height="160" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" rx="10"/>

  <text x="40" y="48" font-family="system-ui, sans-serif" font-size="16px" font-weight="700" fill="#fbbf24">Topologia fizyczna: Magistrala (Bus Topology)</text>
  <text x="40" y="68" font-family="system-ui, sans-serif" font-size="12px" fill="#94a3b8">Wspólny kabel koncentryczny z terminatorami 50 Ω na końcach</text>

  <!-- Szyna kablowa -->
  <line x1="80" y1="135" x2="560" y2="135" stroke="#f59e0b" stroke-width="6"/>

  <!-- Terminator lewy -->
  <g transform="translate(45, 120)">
    <rect width="35" height="30" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5" rx="4"/>
    <text x="17.5" y="20" font-family="monospace" font-size="11px" font-weight="700" fill="#fecaca" text-anchor="middle">50Ω</text>
  </g>

  <!-- Terminator prawy -->
  <g transform="translate(560, 120)">
    <rect width="35" height="30" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5" rx="4"/>
    <text x="17.5" y="20" font-family="monospace" font-size="11px" font-weight="700" fill="#fecaca" text-anchor="middle">50Ω</text>
  </g>

  <!-- Stacje z trójnikami BNC -->
  <!-- Stacja 1 -->
  <line x1="160" y1="135" x2="160" y2="110" stroke="#f59e0b" stroke-width="3"/>
  <g transform="translate(130, 75)">
    <rect width="60" height="35" fill="#0f172a" stroke="#64748b" stroke-width="1.5" rx="4"/>
    <text x="30" y="22" font-family="monospace" font-size="11px" font-weight="700" fill="#fff" text-anchor="middle">PC A</text>
  </g>

  <!-- Stacja 2 -->
  <line x1="320" y1="135" x2="320" y2="110" stroke="#f59e0b" stroke-width="3"/>
  <g transform="translate(290, 75)">
    <rect width="60" height="35" fill="#0f172a" stroke="#64748b" stroke-width="1.5" rx="4"/>
    <text x="30" y="22" font-family="monospace" font-size="11px" font-weight="700" fill="#fff" text-anchor="middle">PC B</text>
  </g>

  <!-- Stacja 3 -->
  <line x1="480" y1="135" x2="480" y2="110" stroke="#f59e0b" stroke-width="3"/>
  <g transform="translate(450, 75)">
    <rect width="60" height="35" fill="#0f172a" stroke="#64748b" stroke-width="1.5" rx="4"/>
    <text x="30" y="22" font-family="monospace" font-size="11px" font-weight="700" fill="#fff" text-anchor="middle">PC C</text>
  </g>

  <text x="320" y="165" font-family="system-ui, sans-serif" font-size="11px" fill="#ef4444" text-anchor="middle">⚠️ Przerwanie kabla w dowolnym miejscu odbija falę i unieruchamia całą sieć</text>
</svg>
