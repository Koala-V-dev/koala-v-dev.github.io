<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4ade80"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>

  <text x="480" y="32" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">Bezpieczny kanał SSH (Port 22): Wymiana kluczy i autoryzacja asymetryczna</text>
  <text x="480" y="52" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Uzgodnienie klucza symetrycznego (Diffie-Hellman), known_hosts oraz autoryzacja kluczem ed25519</text>

  <!-- FAZY PROTOKOŁU SSH -->
  <g transform="translate(60, 75)">
    <!-- Kolumna Klient -->
    <rect x="0" y="0" width="200" height="420" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="28" rx="6" fill="#0369a1"/>
    <text x="100" y="19" fill="#f0f9ff" font-size="11" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">KLIENT SSH (ssh user@host)</text>

    <!-- Kolumna Serwer -->
    <rect x="640" y="0" width="200" height="420" rx="6" fill="#0f172a" stroke="#4ade80" stroke-width="1.5"/>
    <rect x="640" y="0" width="200" height="28" rx="6" fill="#166534"/>
    <text x="740" y="19" fill="#f0fdf4" font-size="11" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">SERWER SSH (sshd :22)</text>

    <!-- Oś pionowa -->
    <line x1="100" y1="35" x2="100" y2="400" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="740" y1="35" x2="740" y2="400" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- FAZA 1: NEGOCJACJA KEX & KLUCZ SESJI -->
    <g transform="translate(0, 45)">
      <rect x="230" y="0" width="380" height="95" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="420" y="20" fill="#38bdf8" font-size="11" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">FAZA 1: WYMIANA KLUCZA (DIFFIE-HELLMAN / KEX)</text>
      
      <line x1="100" y1="35" x2="730" y2="45" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
      <line x1="740" y1="55" x2="110" y2="65" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>

      <text x="420" y="58" fill="#cbd5e1" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">Wymiana liczb publicznych bez ujawniania sekretów</text>
      <text x="420" y="74" fill="#86efac" font-size="9" font-family="monospace" font-weight="700" text-anchor="middle">WYNIK: Obie strony mają ten sam symetryczny klucz AES-256!</text>
      <text x="420" y="88" fill="#94a3b8" font-size="8" font-family="system-ui, sans-serif" text-anchor="middle">Od tego momentu cały ruch w sieci jest w 100% zaszyfrowany.</text>
    </g>

    <!-- FAZA 2: WERYFIKACJA TOŻSAMOŚCI SERWERA -->
    <g transform="translate(0, 160)">
      <rect x="230" y="0" width="380" height="90" rx="6" fill="#1e293b" stroke="#facc15" stroke-width="1.2"/>
      <text x="420" y="20" fill="#facc15" font-size="11" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">FAZA 2: WERYFIKACJA HOSTA (KNOWN_HOSTS)</text>

      <line x1="740" y1="35" x2="110" y2="35" stroke="#facc15" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="420" y="30" fill="#facc15" font-size="9" font-family="monospace" text-anchor="middle">Podpis kluczem hosta (Host Key Fingerprint)</text>

      <rect x="15" y="45" width="170" height="38" rx="3" fill="#0f172a"/>
      <text x="100" y="60" fill="#cbd5e1" font-size="8" font-family="monospace" text-anchor="middle">Sprawdzenie w pliku:</text>
      <text x="100" y="74" fill="#38bdf8" font-size="8" font-family="monospace" text-anchor="middle">~/.ssh/known_hosts</text>

      <text x="420" y="62" fill="#cbd5e1" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">Ochrona przed podsłuchem Man-in-the-Middle (MitM).</text>
      <text x="420" y="76" fill="#fca5a5" font-size="8" font-family="system-ui, sans-serif" text-anchor="middle">Jeśli fingerprint uległ zmianie -> Ostrzeżenie WARNING: REMOTE HOST IDENTIFICATION HAS CHANGED!</text>
    </g>

    <!-- FAZA 3: UWIERZYTELNIENIE UŻYTKOWNIKA -->
    <g transform="translate(0, 270)">
      <rect x="230" y="0" width="380" height="135" rx="6" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
      <text x="420" y="20" fill="#4ade80" font-size="11" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">FAZA 3: AUTORYZACJA KLUCZEM (PUBLIC KEY AUTH)</text>

      <!-- Pliki kluczy -->
      <rect x="15" y="10" width="170" height="48" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="100" y="28" fill="#38bdf8" font-size="8" font-family="monospace" text-anchor="middle">Klucz prywatny klienta:</text>
      <text x="100" y="44" fill="#f87171" font-size="8" font-family="monospace" text-anchor="middle">~/.ssh/id_ed25519 (CHRONIONY)</text>

      <rect x="655" y="10" width="170" height="48" rx="3" fill="#0f172a" stroke="#4ade80" stroke-width="1"/>
      <text x="740" y="28" fill="#4ade80" font-size="8" font-family="monospace" text-anchor="middle">Klucz publiczny wgrany na serwer:</text>
      <text x="740" y="44" fill="#86efac" font-size="8" font-family="monospace" text-anchor="middle">~/.ssh/authorized_keys</text>

      <!-- Wyzwanie kryptograficzne -->
      <line x1="740" y1="65" x2="110" y2="75" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrow-green)"/>
      <text x="420" y="68" fill="#cbd5e1" font-size="8" font-family="monospace" text-anchor="middle">1. Serwer generuje losowe wyzwanie (Challenge Nonce)</text>

      <line x1="100" y1="95" x2="730" y2="105" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrow-green)"/>
      <text x="420" y="98" fill="#86efac" font-size="8" font-family="monospace" text-anchor="middle">2. Klient podpisuje wyzwanie swoim kluczem prywatnym</text>

      <text x="420" y="124" fill="#dcfce7" font-size="9" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">Serwer weryfikuje podpis kluczem publicznym -> Dostęp przyznany (Login OK!)</text>
    </g>
  </g>
</svg>