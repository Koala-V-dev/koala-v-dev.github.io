<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 800; fill: #f8fafc; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #94a3b8; }
      .plug-card { fill: #1e293b; stroke: #334155; stroke-width: 2; rx: 12; }
      .plug-title { font-family: system-ui, sans-serif; font-size: 17px; font-weight: 700; text-anchor: middle; }
      .plug-case { fill: #0f172a; stroke: #64748b; stroke-width: 2; rx: 8; }
      .pin-label { font-family: monospace; font-size: 12px; font-weight: 700; fill: #94a3b8; }
      .wire-name { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #f8fafc; }
      .wire-rect { rx: 3; }
      .highlight-badge { fill: #451a03; stroke: #f97316; stroke-width: 1.5; rx: 6; }
      .badge-text { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #fdba74; text-anchor: middle; }
    </style>
  </defs>

  <rect width="840" height="420" class="bg"/>

  <!-- Tytuł -->
  <text x="40" y="42" class="title">Standardy zaciskania wtyku RJ-45 (8P8C)</text>
  <text x="40" y="66" class="subtitle">Widok od spodu wtyku (złote styki skierowane do góry, zatrzask pod spodem)</text>

  <!-- ================= T568A ================= -->
  <g transform="translate(40, 85)">
    <rect width="360" height="310" class="plug-card"/>
    <text x="180" y="32" class="plug-title" fill="#34d399">Standard T568A</text>

    <!-- Obudowa wtyku -->
    <g transform="translate(25, 48)">
      <rect width="310" height="235" class="plug-case"/>

      <!-- 8 żył -->
      <!-- 1 -->
      <text x="12" y="24" class="pin-label">1</text>
      <rect x="30" y="11" width="90" height="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2" class="wire-rect"/>
      <text x="130" y="25" class="wire-name">Biało-Zielony</text>

      <!-- 2 -->
      <text x="12" y="52" class="pin-label">2</text>
      <rect x="30" y="39" width="90" height="18" fill="#10b981" class="wire-rect"/>
      <text x="130" y="53" class="wire-name">Zielony</text>

      <!-- 3 -->
      <text x="12" y="80" class="pin-label">3</text>
      <rect x="30" y="67" width="90" height="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" class="wire-rect"/>
      <text x="130" y="81" class="wire-name">Biało-Pomarańcz</text>

      <!-- 4 -->
      <text x="12" y="108" class="pin-label">4</text>
      <rect x="30" y="95" width="90" height="18" fill="#3b82f6" class="wire-rect"/>
      <text x="130" y="109" class="wire-name">Niebieski</text>

      <!-- 5 -->
      <text x="12" y="136" class="pin-label">5</text>
      <rect x="30" y="123" width="90" height="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" class="wire-rect"/>
      <text x="130" y="137" class="wire-name">Biało-Niebieski</text>

      <!-- 6 -->
      <text x="12" y="164" class="pin-label">6</text>
      <rect x="30" y="151" width="90" height="18" fill="#f59e0b" class="wire-rect"/>
      <text x="130" y="165" class="wire-name">Pomarańczowy</text>

      <!-- 7 -->
      <text x="12" y="192" class="pin-label">7</text>
      <rect x="30" y="179" width="90" height="18" fill="#fafaf9" stroke="#78350f" stroke-width="2" class="wire-rect"/>
      <text x="130" y="193" class="wire-name">Biało-Brązowy</text>

      <!-- 8 -->
      <text x="12" y="220" class="pin-label">8</text>
      <rect x="30" y="207" width="90" height="18" fill="#78350f" class="wire-rect"/>
      <text x="130" y="221" class="wire-name">Brązowy</text>
    </g>
  </g>

  <!-- ================= T568B ================= -->
  <g transform="translate(440, 85)">
    <rect width="360" height="310" class="plug-card" stroke="#fbbf24"/>
    <text x="180" y="32" class="plug-title" fill="#fbbf24">Standard T568B (Powszechny)</text>

    <!-- Obudowa wtyku -->
    <g transform="translate(25, 48)">
      <rect width="310" height="235" class="plug-case"/>

      <!-- 1 -->
      <text x="12" y="24" class="pin-label">1</text>
      <rect x="30" y="11" width="90" height="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" class="wire-rect"/>
      <text x="130" y="25" class="wire-name">Biało-Pomarańcz</text>

      <!-- 2 -->
      <text x="12" y="52" class="pin-label">2</text>
      <rect x="30" y="39" width="90" height="18" fill="#f59e0b" class="wire-rect"/>
      <text x="130" y="53" class="wire-name">Pomarańczowy</text>

      <!-- 3 -->
      <text x="12" y="80" class="pin-label">3</text>
      <rect x="30" y="67" width="90" height="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2" class="wire-rect"/>
      <text x="130" y="81" class="wire-name">Biało-Zielony</text>

      <!-- 4 -->
      <text x="12" y="108" class="pin-label">4</text>
      <rect x="30" y="95" width="90" height="18" fill="#3b82f6" class="wire-rect"/>
      <text x="130" y="109" class="wire-name">Niebieski</text>

      <!-- 5 -->
      <text x="12" y="136" class="pin-label">5</text>
      <rect x="30" y="123" width="90" height="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" class="wire-rect"/>
      <text x="130" y="137" class="wire-name">Biało-Niebieski</text>

      <!-- 6 -->
      <text x="12" y="164" class="pin-label">6</text>
      <rect x="30" y="151" width="90" height="18" fill="#10b981" class="wire-rect"/>
      <text x="130" y="165" class="wire-name">Zielony</text>

      <!-- 7 -->
      <text x="12" y="192" class="pin-label">7</text>
      <rect x="30" y="179" width="90" height="18" fill="#fafaf9" stroke="#78350f" stroke-width="2" class="wire-rect"/>
      <text x="130" y="193" class="wire-name">Biało-Brązowy</text>

      <!-- 8 -->
      <text x="12" y="220" class="pin-label">8</text>
      <rect x="30" y="207" width="90" height="18" fill="#78350f" class="wire-rect"/>
      <text x="130" y="221" class="wire-name">Brązowy</text>
    </g>
  </g>
</svg>
