<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect x="20" y="20" width="600" height="160" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" rx="10"/>

  <text x="40" y="48" font-family="system-ui, sans-serif" font-size="16px" font-weight="700" fill="#f87171">Komutacja obwodów (Telefonia analogowa PSTN)</text>
  <text x="40" y="68" font-family="system-ui, sans-serif" font-size="12px" fill="#94a3b8">Fizycznie zablokowany, dedykowany tor kablowy na cały czas trwania rozmowy</text>

  <!-- Tor zarezerwowany -->
  <path d="M 120 125 L 240 125 L 400 125 L 520 125" stroke="#ef4444" stroke-width="4" stroke-dasharray="6 3" fill="none"/>

  <!-- Nadawca A -->
  <g transform="translate(40, 95)">
    <rect width="80" height="55" fill="#0f172a" stroke="#ef4444" stroke-width="2" rx="6"/>
    <text x="40" y="28" font-family="system-ui, sans-serif" font-size="12px" font-weight="700" fill="#f8fafc" text-anchor="middle">Host A</text>
    <text x="40" y="44" font-family="monospace" font-size="9px" fill="#f87171" text-anchor="middle">Nadawca</text>
  </g>

  <!-- Centrala 1 -->
  <g transform="translate(200, 100)">
    <rect width="70" height="45" fill="#1e293b" stroke="#64748b" stroke-width="1.5" rx="6"/>
    <text x="35" y="26" font-family="system-ui, sans-serif" font-size="11px" font-weight="600" fill="#cbd5e1" text-anchor="middle">Centrala 1</text>
  </g>

  <!-- Przerwanie kabla / awaria -->
  <circle cx="320" cy="125" r="14" fill="#ef4444"/>
  <text x="320" y="130" font-family="sans-serif" font-size="14px" font-weight="bold" fill="#fff" text-anchor="middle">✕</text>

  <!-- Centrala 2 -->
  <g transform="translate(370, 100)">
    <rect width="70" height="45" fill="#1e293b" stroke="#64748b" stroke-width="1.5" rx="6"/>
    <text x="35" y="26" font-family="system-ui, sans-serif" font-size="11px" font-weight="600" fill="#cbd5e1" text-anchor="middle">Centrala 2</text>
  </g>

  <!-- Odbiorca B -->
  <g transform="translate(520, 95)">
    <rect width="80" height="55" fill="#0f172a" stroke="#ef4444" stroke-width="2" rx="6"/>
    <text x="40" y="28" font-family="system-ui, sans-serif" font-size="12px" font-weight="700" fill="#f8fafc" text-anchor="middle">Host B</text>
    <text x="40" y="44" font-family="monospace" font-size="9px" fill="#f87171" text-anchor="middle">Odbiorca</text>
  </g>

  <text x="320" y="165" font-family="system-ui, sans-serif" font-size="11px" fill="#f87171" text-anchor="middle">⚠️ Przerwanie kabla natychmiast zrywa połączenie – brak alternatywnej trasy</text>
</svg>
