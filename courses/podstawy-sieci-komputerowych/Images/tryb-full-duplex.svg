<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect x="20" y="20" width="600" height="160" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="10"/>

  <text x="40" y="48" font-family="system-ui, sans-serif" font-size="16px" font-weight="700" fill="#34d399">Tryb Full-Duplex: Autostrada dwupasmowa</text>
  <text x="40" y="68" font-family="system-ui, sans-serif" font-size="12px" fill="#94a3b8">Jednoczesny ruch w obu kierunkach. Całkowity brak kolizji!</text>

  <!-- Autostrada dwujezdniowa -->
  <g transform="translate(40, 85)">
    <rect width="520" height="75" fill="#0f172a" rx="6" stroke="#334155" stroke-width="1"/>

    <!-- Pas górny (Tx) ruch w prawo -->
    <g transform="translate(100, 8)">
      <rect width="90" height="24" fill="#38bdf8" rx="4"/>
      <text x="45" y="16" font-family="monospace" font-size="10px" font-weight="700" fill="#0f172a" text-anchor="middle">Linia Tx (A►B)</text>
    </g>

    <!-- Betonowa bariera rozdzielająca (separacja par żył) -->
    <line x1="20" y1="37" x2="500" y2="37" stroke="#64748b" stroke-width="3"/>

    <!-- Pas dolny (Rx) ruch w lewo -->
    <g transform="translate(330, 43)">
      <rect width="90" height="24" fill="#34d399" rx="4"/>
      <text x="45" y="16" font-family="monospace" font-size="10px" font-weight="700" fill="#0f172a" text-anchor="middle">Linia Rx (◄B-A)</text>
    </g>

    <text x="260" y="24" font-family="system-ui, sans-serif" font-size="10px" font-weight="700" fill="#38bdf8" text-anchor="middle">Pas nadawania (Tx)</text>
    <text x="260" y="60" font-family="system-ui, sans-serif" font-size="10px" font-weight="700" fill="#34d399" text-anchor="middle">Pas odbioru (Rx)</text>
  </g>
</svg>
