<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4ade80"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Tło -->
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <!-- Tytuł -->
  <text x="480" y="32" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">Translacja adresów i portów (NAT / NAPT) oraz Port Forwarding</text>
  <text x="480" y="52" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Przepisywanie nagłówka IP/L4 w locie i problem połączeń przychodzących w P2P / Hostowaniu gier</text>

  <!-- SEKCJA TOPOLOGII: SIEĆ PRYWATNA -> RUTERY NAT -> INTERNET -->
  <g transform="translate(60, 75)">
    <!-- 1. Stacja robocza (Host LAN) -->
    <rect x="0" y="20" width="190" height="150" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="20" width="190" height="26" rx="6" fill="#0369a1"/>
    <text x="95" y="37" fill="#f0f9ff" font-size="11" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">HOST A (Sieć LAN)</text>

    <text x="10" y="65" fill="#cbd5e1" font-size="10" font-family="monospace">Prywatny IP: 192.168.1.15</text>
    <text x="10" y="80" fill="#94a3b8" font-size="9" font-family="system-ui, sans-serif">Gra co-op / socket:</text>
    <rect x="10" y="88" width="170" height="42" rx="3" fill="#1e293b"/>
    <text x="15" y="104" fill="#38bdf8" font-size="9" font-family="monospace">SRC IP: 192.168.1.15</text>
    <text x="15" y="118" fill="#38bdf8" font-size="9" font-family="monospace">SRC Port: 50000 (UDP)</text>
    <text x="95" y="155" fill="#facc15" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">Wysyła pakiet na zewnątrz -></text>

    <!-- Strzałka z LAN do Rutera -->
    <line x1="190" y1="95" x2="255" y2="95" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 2. RUTER BRAMOWY (NAT / PAT) -->
    <rect x="260" y="0" width="320" height="210" rx="6" fill="#0f172a" stroke="#facc15" stroke-width="2"/>
    <rect x="260" y="0" width="320" height="28" rx="6" fill="#854d0e"/>
    <text x="420" y="19" fill="#fef08a" font-size="11" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">RUTER BRAMOWY (NAT / PAT TABLE)</text>

    <text x="270" y="44" fill="#94a3b8" font-size="9" font-family="monospace">LAN: 192.168.1.1  |  WAN: 203.0.113.4 (Public)</text>

    <!-- Tabela translacji -->
    <rect x="270" y="52" width="300" height="90" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="275" y="68" fill="#facc15" font-size="9" font-family="system-ui, sans-serif" font-weight="700">Aktywny wpis w tablicy NAT (State Table):</text>
    <text x="275" y="86" fill="#38bdf8" font-size="9" font-family="monospace">Inside Local:   192.168.1.15:50000</text>
    <text x="275" y="102" fill="#4ade80" font-size="9" font-family="monospace">Inside Global:  203.0.113.4:41234 (Podmienione!)</text>
    <text x="275" y="118" fill="#e2e8f0" font-size="9" font-family="monospace">Outside Global: 198.51.100.8:27015</text>
    <text x="275" y="134" fill="#94a3b8" font-size="8" font-family="system-ui, sans-serif">Timeout bezczynności: UDP ~30s / TCP ~2h</text>

    <rect x="270" y="150" width="300" height="48" rx="4" fill="#312e81"/>
    <text x="275" y="166" fill="#c7d2fe" font-size="9" font-family="system-ui, sans-serif" font-weight="700">Przepisywanie w locie (Rewriting):</text>
    <text x="275" y="180" fill="#a5b4fc" font-size="8" font-family="system-ui, sans-serif">Ruter podmienia IP i Port nadawcy oraz przelicza sumę L3/L4!</text>
    <text x="275" y="192" fill="#818cf8" font-size="8" font-family="monospace">IP 192.168.1.15 -> 203.0.113.4 | Port 50000 -> 41234</text>

    <!-- Strzałka z Rutera do Internetu -->
    <line x1="580" y1="95" x2="645" y2="95" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow-green)"/>

    <!-- 3. Zewnętrzny serwer / Peer w Internecie -->
    <rect x="650" y="20" width="190" height="150" rx="6" fill="#0f172a" stroke="#4ade80" stroke-width="1.5"/>
    <rect x="650" y="20" width="190" height="26" rx="6" fill="#166534"/>
    <text x="745" y="37" fill="#f0fdf4" font-size="11" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">SERWER / PEER (Internet)</text>

    <text x="660" y="65" fill="#cbd5e1" font-size="10" font-family="monospace">Public IP: 198.51.100.8</text>
    <text x="660" y="80" fill="#94a3b8" font-size="9" font-family="system-ui, sans-serif">Odbiera pakiet jako:</text>
    <rect x="660" y="88" width="170" height="42" rx="3" fill="#1e293b"/>
    <text x="665" y="104" fill="#4ade80" font-size="9" font-family="monospace">SRC IP: 203.0.113.4</text>
    <text x="665" y="118" fill="#4ade80" font-size="9" font-family="monospace">SRC Port: 41234 (UDP)</text>
    <text x="745" y="155" fill="#86efac" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">Odpowiedź trafia w wycięty wpis</text>
  </g>

  <!-- CZĘŚĆ DOLNA: DLACZEGO BEZ PORT FORWARDING / HOLE PUNCHING NIE DA SIĘ HOSTONAĆ? -->
  <g transform="translate(60, 305)">
    <rect width="840" height="145" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <rect width="840" height="26" rx="6" fill="#450a0a"/>
    <text x="420" y="18" fill="#fecaca" font-size="11" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">PUŁAPKA P2P: CO JEŚLI ZEWNĘTRZNY GRACZ CHCE SIĘ POŁĄCZYĆ PIERWSZY (HOSTOWANIE GRY)?</text>

    <!-- Sytuacja bez port forwardingu -->
    <g transform="translate(20, 38)">
      <rect width="385" height="92" rx="4" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
      <text x="15" y="22" fill="#ef4444" font-size="11" font-family="system-ui, sans-serif" font-weight="700">1. Brak reguły w routerze (Domyślne odrzucenie)</text>
      <text x="15" y="42" fill="#cbd5e1" font-size="9" font-family="system-ui, sans-serif">Zewnętrzny gracz wysyła pakiet na 203.0.113.4:7777.</text>
      <text x="15" y="58" fill="#fca5a5" font-size="9" font-family="system-ui, sans-serif">Ruter sprawdza tablicę NAT: brak wpisu dla portu 7777.</text>
      <text x="15" y="74" fill="#f87171" font-size="9" font-family="system-ui, sans-serif" font-weight="700">REZULTAT: DROP (Pakiet cicho skasowany przez zaporę!).</text>
    </g>

    <!-- Rozwiązanie: Port Forwarding / STUN UDP Hole Punching -->
    <g transform="translate(435, 38)">
      <rect width="385" height="92" rx="4" fill="#1e293b" stroke="#4ade80" stroke-width="1"/>
      <text x="15" y="22" fill="#4ade80" font-size="11" font-family="system-ui, sans-serif" font-weight="700">2. Rozwiązanie inżynierskie (Port Forward / STUN)</text>
      <text x="15" y="40" fill="#cbd5e1" font-size="9" font-family="system-ui, sans-serif">&#8226; <tspan font-weight="700" fill="#facc15">Port Forwarding (Statyczny):</tspan> Reguła WAN 7777 -> LAN 192.168.1.15:7777.</text>
      <text x="15" y="58" fill="#cbd5e1" font-size="9" font-family="system-ui, sans-serif">&#8226; <tspan font-weight="700" fill="#38bdf8">UDP Hole Punching (STUN RFC 5389):</tspan> Obaj gracze wysyłają pakiety</text>
      <text x="15" y="72" fill="#cbd5e1" font-size="9" font-family="system-ui, sans-serif">  jednocześnie, tworząc tymczasowe wpisy NAT w swoich routerach.</text>
      <text x="15" y="86" fill="#86efac" font-size="9" font-family="system-ui, sans-serif" font-weight="700">REZULTAT: Bezpośrednie połączenie P2P bez opłat za serwery dedykowane.</text>
    </g>
  </g>
</svg>