<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <!-- Tło -->
  <rect width="100%" height="100%" fill="#0b1120" rx="0"/>
  
  <!-- Tytuł -->
  <text x="480" y="38" fill="#f8fafc" font-size="20" font-family="system-ui, -apple-system, sans-serif" font-weight="700" text-anchor="middle">Struktura, kompresja i typy adresów IPv6 (128 bitów)</text>
  <text x="480" y="62" fill="#94a3b8" font-size="13" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Zasady zapisu heksadecymalnego, kompresja zer oraz zastąpienie ARP przez ICMPv6 (NDP)</text>

  <!-- SEKCJA 1: Podział adresu 128-bitowego -->
  <g transform="translate(40, 85)">
    <rect width="880" height="95" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="440" y="24" fill="#38bdf8" font-size="13" font-family="system-ui, -apple-system, sans-serif" font-weight="700" text-anchor="middle">Anatomia typowego adresu Global Unicast (/64)</text>

    <!-- Prefiks sieciowy 64 bity -->
    <rect x="25" y="40" width="410" height="42" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="230" y="58" fill="#38bdf8" font-size="12" font-family="system-ui, -apple-system, sans-serif" font-weight="700" text-anchor="middle">Network Prefix (64 bity)</text>
    <text x="230" y="74" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">2001:0db8:0000:0001</text>

    <!-- Identyfikator interfejsu 64 bity -->
    <rect x="445" y="40" width="410" height="42" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <text x="650" y="58" fill="#34d399" font-size="12" font-family="system-ui, -apple-system, sans-serif" font-weight="700" text-anchor="middle">Interface ID (Host ID - 64 bity)</text>
    <text x="650" y="74" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">0000:0000:0000:0042</text>
  </g>

  <!-- SEKCJA 2: Reguły kompresji -->
  <g transform="translate(40, 195)">
    <rect width="530" height="205" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="530" height="28" rx="8" fill="#0f172a"/>
    <text x="20" y="19" fill="#fde047" font-size="12" font-family="system-ui, -apple-system, sans-serif" font-weight="700">Reguły kompresji zapisu IPv6 (RFC 5952)</text>

    <!-- Adres pełny -->
    <text x="20" y="50" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">1. Pełny adres (8 hekstetów po 16 bitów):</text>
    <rect x="20" y="58" width="490" height="26" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="265" y="75" fill="#f8fafc" font-size="11" font-family="monospace" text-anchor="middle">2001 : 0db8 : 0000 : 0000 : 0000 : 0000 : 0000 : 0001</text>

    <!-- Reguła 1: Usuwanie zer wiodących -->
    <text x="20" y="102" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">2. Reguła 1: Pomijanie wiodących zer w hekstecie (0db8 &#8594; db8, 0000 &#8594; 0):</text>
    <rect x="20" y="110" width="490" height="26" rx="3" fill="#0f172a" stroke="#eab308" stroke-width="1"/>
    <text x="265" y="127" fill="#fde047" font-size="11" font-family="monospace" text-anchor="middle">2001 : db8 : 0 : 0 : 0 : 0 : 0 : 1</text>

    <!-- Reguła 2: Podwójny dwukropek -->
    <text x="20" y="154" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">3. Reguła 2: Zastąpienie najdłuższego ciągu zer znakiem "::" (TYLKO RAZ!):</text>
    <rect x="20" y="162" width="490" height="28" rx="3" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <text x="265" y="181" fill="#34d399" font-size="13" font-family="monospace" font-weight="700" text-anchor="middle">2001:db8::1</text>
  </g>

  <!-- SEKCJA 3: Kluczowe prefiksy IPv6 -->
  <g transform="translate(590, 195)">
    <rect width="330" height="205" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="330" height="28" rx="8" fill="#0f172a"/>
    <text x="20" y="19" fill="#38bdf8" font-size="12" font-family="system-ui, -apple-system, sans-serif" font-weight="700">Kluczowe Prefiksy (Standard IANA)</text>

    <rect x="15" y="38" width="300" height="35" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="25" y="53" fill="#38bdf8" font-size="11" font-family="monospace" font-weight="700">2000::/3</text>
    <text x="110" y="53" fill="#cbd5e1" font-size="10" font-family="system-ui, -apple-system, sans-serif">Global Unicast (Publiczne)</text>
    <text x="25" y="66" fill="#94a3b8" font-size="9" font-family="system-ui, -apple-system, sans-serif">Rutowalne globalnie w sieci Internet</text>

    <rect x="15" y="78" width="300" height="35" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="25" y="93" fill="#34d399" font-size="11" font-family="monospace" font-weight="700">fe80::/10</text>
    <text x="110" y="93" fill="#cbd5e1" font-size="10" font-family="system-ui, -apple-system, sans-serif">Link-Local (Lokalne łącza)</text>
    <text x="25" y="106" fill="#94a3b8" font-size="9" font-family="system-ui, -apple-system, sans-serif">Wymagane na każdym interfejsie L2</text>

    <rect x="15" y="118" width="300" height="35" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="25" y="133" fill="#fde047" font-size="11" font-family="monospace" font-weight="700">fc00::/7</text>
    <text x="110" y="133" fill="#cbd5e1" font-size="10" font-family="system-ui, -apple-system, sans-serif">Unique Local (ULA - Prywatne)</text>
    <text x="25" y="146" fill="#94a3b8" font-size="9" font-family="system-ui, -apple-system, sans-serif">Odpowiednik RFC 1918 (LAN)</text>

    <rect x="15" y="158" width="300" height="35" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="25" y="173" fill="#f87171" font-size="11" font-family="monospace" font-weight="700">::1 / 128</text>
    <text x="110" y="173" fill="#cbd5e1" font-size="10" font-family="system-ui, -apple-system, sans-serif">Loopback (Pętla zwrotna)</text>
    <text x="25" y="186" fill="#94a3b8" font-size="9" font-family="system-ui, -apple-system, sans-serif">Odpowiednik 127.0.0.1 w IPv4</text>
  </g>

  <!-- SEKCJA 4: NDP zamiast ARP -->
  <g transform="translate(40, 415)">
    <rect width="880" height="85" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="20" y="24" fill="#34d399" font-size="12" font-family="system-ui, -apple-system, sans-serif" font-weight="700">Koniec z zalewaniem sieci rozgłoszeniami (Brak Broadcastu w IPv6!)</text>
    <text x="20" y="44" fill="#cbd5e1" font-size="11" font-family="system-ui, -apple-system, sans-serif">W protokole IPv6 całkowicie wyeliminowano pakiety rozgłoszeniowe (Broadcast). Zastąpiono je protokołem <tspan fill="#38bdf8" font-weight="600">NDP (Neighbor Discovery Protocol, RFC 4861)</tspan>.</text>
    <text x="20" y="62" fill="#94a3b8" font-size="10" font-family="system-ui, -apple-system, sans-serif">Zamiast odpytywać całą podsieć (ARP Request na FF:FF:FF:FF:FF:FF), stacja wysyła <tspan fill="#fde047">Neighbor Solicitation (NS)</tspan> na wyspecjalizowany adres grupy multicastowej węzła (Solicited-Node Multicast). Tylko adresat wybudza kartę sieciową!</text>
  </g>
</svg>