<svg viewBox="0 0 220 120" width="100%" xmlns="http://www.w3.org/2000/svg">
  <rect width="220" height="120" rx="10" fill="#0f172a"/>
  <!-- Kabel UTP przechodzący przez szczękę ściągacza -->
  <rect x="135" y="12" width="18" height="96" rx="4" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Żółty obrotowy ściągacz izolacji (HT-S501A / Krone) -->
  <circle cx="52" cy="60" r="24" fill="none" stroke="#eab308" stroke-width="11"/>
  <circle cx="52" cy="60" r="29.5" fill="none" stroke="#a16207" stroke-width="1.5"/>
  <rect x="74" y="42" width="76" height="36" rx="8" fill="#eab308" stroke="#a16207" stroke-width="2"/>
  <!-- Szczęka zaciskowa wokół kabla -->
  <path d="M 148 40 C 172 40, 174 80, 148 80" fill="#facc15" stroke="#a16207" stroke-width="2"/>
  <circle cx="144" cy="60" r="10" fill="#334155" stroke="#a16207" stroke-width="2"/>
  <!-- Ostrze tnące wewnątrz szczęki -->
  <polygon points="134,54 140,60 134,66" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
  <!-- Przetłoczenia na palec -->
  <line x1="88" y1="52" x2="118" y2="52" stroke="#a16207" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="88" y1="60" x2="118" y2="60" stroke="#a16207" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="88" y1="68" x2="118" y2="68" stroke="#a16207" stroke-width="2.5" stroke-linecap="round"/>
</svg>
