<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 800; fill: #ffffff; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .node-hdr { font-family: system-ui, sans-serif; font-size: 11.5px; font-weight: 800; text-anchor: middle; }
      .node-sub { font-family: monospace; font-size: 9px; font-weight: 700; text-anchor: middle; }
      .pkt-lbl { font-family: monospace; font-size: 9px; font-weight: 700; fill: #ffffff; }
      .step-title { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; }
      .desc-txt { font-family: system-ui, sans-serif; font-size: 9px; fill: #cbd5e1; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <text x="30" y="30" class="title">Mechanizm protokołu ARP: Cykl Request (Broadcast) i Reply (Unicast)</text>
  <text x="30" y="48" class="sub">Jak komputer A ustala fizyczny adres MAC komputera B, znając wyłącznie jego adres logiczny IP</text>

  <!-- ================= HOST A (NADAWCA) ================= -->
  <g transform="translate(30, 75)">
    <rect width="140" height="110" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <rect x="0" y="0" width="140" height="26" fill="#0284c7" rx="6"/>
    <text x="70" y="18" class="node-hdr" fill="#ffffff">HOST A</text>
    <text x="70" y="44" class="node-sub" fill="#cbd5e1">IP: 192.168.1.10</text>
    <text x="70" y="58" class="node-sub" fill="#38bdf8">MAC: AA:AA:AA:AA:AA:AA</text>
    
    <rect x="10" y="68" width="120" height="32" fill="#0b1120" stroke="#0284c7" rx="3"/>
    <text x="70" y="82" font-family="system-ui, sans-serif" font-size="8.5px" font-weight="700" fill="#bae6fd" text-anchor="middle">Chce wysłać dane do:</text>
    <text x="70" y="93" font-family="monospace" font-size="9px" font-weight="800" fill="#fde047" text-anchor="middle">IP 192.168.1.50 (? MAC)</text>
  </g>

  <!-- ================= SWITCH L2 (CENTRUM ROZGŁOSZENIA) ================= -->
  <g transform="translate(290, 75)">
    <rect width="160" height="110" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <rect x="0" y="0" width="160" height="26" fill="#064e3b" rx="6"/>
    <text x="80" y="18" class="node-hdr" fill="#ffffff">SWITCH L2</text>
    
    <text x="80" y="46" font-family="system-ui, sans-serif" font-size="9px" fill="#cbd5e1" text-anchor="middle">Przełącznik sieciowy</text>
    <rect x="10" y="56" width="140" height="44" fill="#0b1120" stroke="#10b981" rx="3"/>
    <text x="80" y="72" font-family="monospace" font-size="8.5px" font-weight="700" fill="#34d399" text-anchor="middle">Broadcast FF:FF... ➔</text>
    <text x="80" y="86" font-family="system-ui, sans-serif" font-size="8.5px" fill="#a7f3d0" text-anchor="middle">Powiel na WSZYSTKIE porty!</text>
  </g>

  <!-- ================= HOST B (WŁAŚCICIEL IP) ================= -->
  <g transform="translate(570, 75)">
    <rect width="140" height="110" fill="#1e293b" stroke="#22c55e" stroke-width="1.5" rx="6"/>
    <rect x="0" y="0" width="140" height="26" fill="#166534" rx="6"/>
    <text x="70" y="18" class="node-hdr" fill="#ffffff">HOST B (CEL)</text>
    <text x="70" y="44" class="node-sub" fill="#cbd5e1">IP: 192.168.1.50</text>
    <text x="70" y="58" class="node-sub" fill="#4ade80">MAC: BB:BB:BB:BB:BB:BB</text>
    
    <rect x="10" y="68" width="120" height="32" fill="#0b1120" stroke="#22c55e" rx="3"/>
    <text x="70" y="82" font-family="system-ui, sans-serif" font-size="8.5px" font-weight="700" fill="#86efac" text-anchor="middle">Rozpoznaje swoje IP:</text>
    <text x="70" y="93" font-family="monospace" font-size="9px" font-weight="800" fill="#ffffff" text-anchor="middle">Odpowiada (Unicast)</text>
  </g>

  <!-- ================= PRZEPŁYW RUCHU: KROK 1 REQUEST (GÓRA) ================= -->
  <!-- Linia A -> Switch -->
  <line x1="170" y1="105" x2="285" y2="105" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="288,105 280,101 280,109" fill="#f59e0b"/>

  <!-- Linia Switch -> B -->
  <line x1="450" y1="105" x2="565" y2="105" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="568,105 560,101 560,109" fill="#f59e0b"/>

  <!-- Karta Pakietu 1: ARP Request -->
  <g transform="translate(190, 88)">
    <rect width="85" height="18" fill="#78350f" stroke="#f59e0b" rx="2"/>
    <text x="42" y="12" font-family="monospace" font-size="8px" font-weight="700" fill="#fde68a" text-anchor="middle">1. ARP Request</text>
  </g>

  <!-- ================= PRZEPŁYW RUCHU: KROK 2 REPLY (DÓŁ) ================= -->
  <!-- Linia B -> Switch (powrót) -->
  <line x1="570" y1="150" x2="455" y2="150" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="452,150 460,146 460,154" fill="#38bdf8"/>

  <!-- Linia Switch -> A (powrót) -->
  <line x1="290" y1="150" x2="175" y2="150" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="172,150 180,146 180,154" fill="#38bdf8"/>

  <!-- Karta Pakietu 2: ARP Reply -->
  <g transform="translate(470, 133)">
    <rect width="85" height="18" fill="#0369a1" stroke="#38bdf8" rx="2"/>
    <text x="42" y="12" font-family="monospace" font-size="8px" font-weight="700" fill="#bae6fd" text-anchor="middle">2. ARP Reply</text>
  </g>

  <!-- ================= PONIŻEJ: ANATOMIA PAKIETÓW W BIEGU ================= -->
  <!-- Pakiet 1: Request -->
  <g transform="translate(30, 205)">
    <rect width="325" height="115" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" rx="6"/>
    <rect x="0" y="0" width="325" height="26" fill="#78350f" rx="6"/>
    <text x="12" y="18" class="step-title">Krok 1: ARP Request (Zapytanie rozgłoszeniowe)</text>

    <g transform="translate(12, 36)">
      <text x="0" y="14" class="pkt-lbl" fill="#fde047">Ramka L2:</text>
      <text x="75" y="14" class="desc-txt">Dst MAC: <tspan font-family="monospace" font-weight="700" fill="#ffffff">FF:FF:FF:FF:FF:FF (Broadcast)</tspan></text>

      <text x="0" y="32" class="pkt-lbl" fill="#fde047">EtherType:</text>
      <text x="75" y="32" class="desc-txt"><tspan font-family="monospace" font-weight="700" fill="#22d3ee">0x0806 (Protokół ARP)</tspan></text>

      <text x="0" y="50" class="pkt-lbl" fill="#fde047">Pytanie ARP:</text>
      <text x="75" y="50" class="desc-txt">"Kto ma IP 192.168.1.50? Odpowiedz do AA:AA..."</text>

      <rect x="0" y="58" width="300" height="16" fill="#0b1120" rx="2"/>
      <text x="6" y="70" font-family="system-ui, sans-serif" font-size="8px" fill="#cbd5e1">Odbierają wszyscy w LAN. Hosty bez tego IP ignorują ramkę.</text>
    </g>
  </g>

  <!-- Pakiet 2: Reply -->
  <g transform="translate(385, 205)">
    <rect width="325" height="115" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <rect x="0" y="0" width="325" height="26" fill="#0369a1" rx="6"/>
    <text x="12" y="18" class="step-title">Krok 2: ARP Reply (Odpowiedź bezpośrednia)</text>

    <g transform="translate(12, 36)">
      <text x="0" y="14" class="pkt-lbl" fill="#38bdf8">Ramka L2:</text>
      <text x="75" y="14" class="desc-txt">Dst MAC: <tspan font-family="monospace" font-weight="700" fill="#4ade80">AA:AA:AA:AA:AA:AA (Unicast!)</tspan></text>

      <text x="0" y="32" class="pkt-lbl" fill="#38bdf8">EtherType:</text>
      <text x="75" y="32" class="desc-txt"><tspan font-family="monospace" font-weight="700" fill="#22d3ee">0x0806 (Protokół ARP)</tspan></text>

      <text x="0" y="50" class="pkt-lbl" fill="#38bdf8">Treść ARP:</text>
      <text x="75" y="50" class="desc-txt">"Ja mam 192.168.1.50! Mój MAC to BB:BB..."</text>

      <rect x="0" y="58" width="300" height="16" fill="#0b1120" rx="2"/>
      <text x="6" y="70" font-family="system-ui, sans-serif" font-size="8px" fill="#a7f3d0">Host A zapisuje mapowanie w pamięci RAM (tablica ARP Cache).</text>
    </g>
  </g>
</svg>
