<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect x="20" y="20" width="600" height="180" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="10"/>

  <text x="40" y="48" font-family="system-ui, sans-serif" font-size="16px" font-weight="700" fill="#38bdf8">Topologia fizyczna: Częściowa siatka (Partial Mesh)</text>
  <text x="40" y="68" font-family="system-ui, sans-serif" font-size="12px" fill="#94a3b8">Zapasowe trasy wyłącznie między węzłami rdzeniowymi, mniejszy koszt okablowania</text>

  <!-- Partial Mesh po lewej -->
  <g transform="translate(55, 82)">
    <!-- Rdzeń: R1 - R2 - R3 (trójkąt zapasowy) -->
    <line x1="85" y1="22" x2="40" y2="62" stroke="#10b981" stroke-width="2.5"/>
    <line x1="85" y1="22" x2="130" y2="62" stroke="#10b981" stroke-width="2.5"/>
    <line x1="40" y1="62" x2="130" y2="62" stroke="#10b981" stroke-width="2.5"/>

    <!-- Węzły brzegowe R4, R5 podpięte tylko wybranymi łączami -->
    <line x1="40" y1="62" x2="20" y2="100" stroke="#38bdf8" stroke-width="2"/>
    <line x1="130" y1="62" x2="150" y2="100" stroke="#38bdf8" stroke-width="2"/>
    <line x1="85" y1="22" x2="150" y2="100" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2"/>

    <!-- Węzły rdzeniowe -->
    <g transform="translate(70, 10)"><rect width="30" height="22" fill="#0f172a" stroke="#34d399" stroke-width="1.5" rx="4"/><text x="15" y="15" font-family="monospace" font-size="10px" font-weight="700" fill="#fff" text-anchor="middle">R1</text></g>
    <g transform="translate(25, 50)"><rect width="30" height="22" fill="#0f172a" stroke="#34d399" stroke-width="1.5" rx="4"/><text x="15" y="15" font-family="monospace" font-size="10px" font-weight="700" fill="#fff" text-anchor="middle">R2</text></g>
    <g transform="translate(115, 50)"><rect width="30" height="22" fill="#0f172a" stroke="#34d399" stroke-width="1.5" rx="4"/><text x="15" y="15" font-family="monospace" font-size="10px" font-weight="700" fill="#fff" text-anchor="middle">R3</text></g>

    <!-- Węzły brzegowe -->
    <g transform="translate(5, 88)"><rect width="30" height="22" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="4"/><text x="15" y="15" font-family="monospace" font-size="10px" font-weight="700" fill="#fff" text-anchor="middle">R4</text></g>
    <g transform="translate(135, 88)"><rect width="30" height="22" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="4"/><text x="15" y="15" font-family="monospace" font-size="10px" font-weight="700" fill="#fff" text-anchor="middle">R5</text></g>
  </g>

  <!-- Opis po prawej -->
  <g transform="translate(265, 92)">
    <rect width="330" height="88" fill="#0f172a" stroke="#475569" stroke-width="1" rx="6"/>
    <text x="14" y="24" font-family="system-ui, sans-serif" font-size="12px" fill="#cbd5e1">• <tspan font-weight="700" fill="#34d399">Rdzeń (R1, R2, R3):</tspan> połączony każdy z każdym</text>
    <text x="26" y="42" font-family="system-ui, sans-serif" font-size="12px" fill="#cbd5e1">zapewnia zapasowe trasy przy awarii.</text>
    <text x="14" y="66" font-family="system-ui, sans-serif" font-size="12px" fill="#cbd5e1">• <tspan font-weight="700" fill="#38bdf8">Brzeg (R4, R5):</tspan> tylko niezbędne łącza do rdzenia.</text>
  </g>
</svg>
