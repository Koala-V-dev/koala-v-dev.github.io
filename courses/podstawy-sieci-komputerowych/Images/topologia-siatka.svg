<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect x="20" y="20" width="600" height="180" fill="#1e293b" stroke="#34d399" stroke-width="1.5" rx="10"/>

  <text x="40" y="48" font-family="system-ui, sans-serif" font-size="16px" font-weight="700" fill="#34d399">Topologia fizyczna: Siatka (Mesh Topology)</text>
  <text x="40" y="68" font-family="system-ui, sans-serif" font-size="12px" fill="#94a3b8">Najwyższa redundancja tras – wzór na połączenia: L = N(N - 1) / 2</text>

  <!-- Full Mesh po lewej -->
  <g transform="translate(60, 85)">
    <!-- Linie każdy z każdym dla 4 routerów -->
    <line x1="25" y1="20" x2="145" y2="20" stroke="#10b981" stroke-width="2"/>
    <line x1="145" y1="20" x2="145" y2="80" stroke="#10b981" stroke-width="2"/>
    <line x1="145" y1="80" x2="25" y2="80" stroke="#10b981" stroke-width="2"/>
    <line x1="25" y1="80" x2="25" y2="20" stroke="#10b981" stroke-width="2"/>
    <line x1="25" y1="20" x2="145" y2="80" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 2"/>
    <line x1="145" y1="20" x2="25" y2="80" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 2"/>

    <!-- 4 Węzły -->
    <g transform="translate(10, 8)"><rect width="30" height="24" fill="#0f172a" stroke="#34d399" rx="4"/><text x="15" y="16" font-family="monospace" font-size="10px" font-weight="700" fill="#fff" text-anchor="middle">R1</text></g>
    <g transform="translate(130, 8)"><rect width="30" height="24" fill="#0f172a" stroke="#34d399" rx="4"/><text x="15" y="16" font-family="monospace" font-size="10px" font-weight="700" fill="#fff" text-anchor="middle">R2</text></g>
    <g transform="translate(130, 68)"><rect width="30" height="24" fill="#0f172a" stroke="#34d399" rx="4"/><text x="15" y="16" font-family="monospace" font-size="10px" font-weight="700" fill="#fff" text-anchor="middle">R3</text></g>
    <g transform="translate(10, 68)"><rect width="30" height="24" fill="#0f172a" stroke="#34d399" rx="4"/><text x="15" y="16" font-family="monospace" font-size="10px" font-weight="700" fill="#fff" text-anchor="middle">R4</text></g>

    <text x="85" y="105" font-family="system-ui, sans-serif" font-size="11px" font-weight="700" fill="#34d399" text-anchor="middle">Pełna siatka (Full Mesh)</text>
  </g>

  <!-- Opis po prawej -->
  <g transform="translate(280, 95)">
    <rect width="310" height="85" fill="#0f172a" stroke="#475569" stroke-width="1" rx="6"/>
    <text x="14" y="24" font-family="system-ui, sans-serif" font-size="12px" fill="#cbd5e1">• <tspan font-weight="700" fill="#34d399">Brak pojedynczego punktu awarii:</tspan> pakiety zawsze</text>
    <text x="26" y="42" font-family="system-ui, sans-serif" font-size="12px" fill="#cbd5e1">mają wolną ścieżkę alternatywną.</text>
    <text x="14" y="66" font-family="system-ui, sans-serif" font-size="12px" fill="#cbd5e1">• <tspan font-weight="700" fill="#fbbf24">Koszt okablowania:</tspan> dla 10 węzłów potrzeba 45 kabli!</text>
  </g>
</svg>
