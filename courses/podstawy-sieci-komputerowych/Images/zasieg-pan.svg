<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 120" width="80" height="120">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card-border { fill: #1e293b; stroke: #38bdf8; stroke-width: 1.5; rx: 8; }
      .acro { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 800; fill: #38bdf8; text-anchor: middle; }
      .name { font-family: system-ui, -apple-system, sans-serif; font-size: 8.5px; font-weight: 600; fill: #94a3b8; text-anchor: middle; }
      .range-bg { fill: #0f172a; stroke: #38bdf8; stroke-width: 1; rx: 4; }
      .range-val { font-family: monospace; font-size: 10px; font-weight: 800; fill: #38bdf8; text-anchor: middle; }
    </style>
  </defs>

  <!-- Tło wypełniające rogi -->
  <rect width="100%" height="100%" class="bg"/>

  <!-- Karta pionowa z dopasowanym promieniem -->
  <rect x="2" y="2" width="76" height="116" class="card-border"/>

  <!-- Ikona -->
  <circle cx="40" cy="24" r="14" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1"/>
  <text x="40" y="30" font-family="sans-serif" font-size="14px" text-anchor="middle">⌚</text>

  <!-- Akronim -->
  <text x="40" y="54" class="acro">PAN</text>
  <text x="40" y="68" class="name">Osobista</text>

  <!-- Pigułka zasięgu -->
  <rect x="8" y="78" width="64" height="26" class="range-bg"/>
  <text x="40" y="95" class="range-val">&lt; 10 m</text>
</svg>
