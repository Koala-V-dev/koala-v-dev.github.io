<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
      .box-title { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 800; }
      .layer-txt { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 700; }
      .desc-txt { font-family: system-ui, sans-serif; font-size: 10px; fill: #94a3b8; }
      .badge-err { fill: #450a0a; stroke: #ef4444; stroke-width: 1; rx: 4; }
      .badge-ok { fill: #064e3b; stroke: #10b981; stroke-width: 1; rx: 4; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <text x="35" y="32" class="title">Architektura monolityczna vs Model warstwowy</text>
  <text x="35" y="50" class="subtitle">Dlaczego inżynieria teleinformatyczna porzuciła systemy zamknięte na rzecz modułowości</text>

  <!-- ================= LEWA STRONA: ARCHITEKTURA MONOLITYCZNA ================= -->
  <g transform="translate(35, 75)">
    <rect width="320" height="200" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" rx="8"/>
    <text x="160" y="28" class="box-title" fill="#f87171" text-anchor="middle">1. Stos Monolityczny (lata 70.)</text>
    <text x="160" y="44" class="desc-txt" text-anchor="middle">SNA (IBM), DECnet – systemy zamknięte</text>

    <!-- Jeden wielki monolit -->
    <g transform="translate(25, 58)">
      <rect width="270" height="85" fill="#450a0a" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 3" rx="6"/>
      <text x="135" y="25" class="layer-txt" fill="#fca5a5" text-anchor="middle">Jednolity kod programu</text>
      <text x="135" y="45" font-family="system-ui, sans-serif" font-size="10.5px" fill="#fecaca" text-anchor="middle">Aplikacja + Logika sieci + Sterownik kabla</text>
      <text x="135" y="65" font-family="system-ui, sans-serif" font-size="9.5px" fill="#f87171" text-anchor="middle">Splecione na stałe w jeden blok pamięci</text>
    </g>

    <!-- Skutek -->
    <g transform="translate(25, 155)">
      <rect width="270" height="30" class="badge-err"/>
      <text x="135" y="20" font-family="system-ui, sans-serif" font-size="10px" font-weight="700" fill="#fca5a5" text-anchor="middle">💥 Zmiana kabla = przepisanie całej aplikacji!</text>
    </g>
  </g>

  <!-- ================= PRAWA STRONA: MODEL WARSTWOWY ================= -->
  <g transform="translate(385, 75)">
    <rect width="320" height="200" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="8"/>
    <text x="160" y="28" class="box-title" fill="#34d399" text-anchor="middle">2. Model Warstwowy (Modułowy)</text>
    <text x="160" y="44" class="desc-txt" text-anchor="middle">Zasada separacji zadań (Separation of Concerns)</text>

    <!-- Warstwy jako niezależne klocki -->
    <g transform="translate(25, 55)">
      <!-- Aplikacja -->
      <rect x="0" y="0" width="270" height="22" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="4"/>
      <text x="135" y="15" class="layer-txt" fill="#38bdf8" text-anchor="middle">Warstwa Aplikacji (np. Przeglądarka / HTTP)</text>

      <!-- Standardowy interfejs API/Socket -->
      <line x1="20" y1="27" x2="250" y2="27" stroke="#64748b" stroke-width="1" stroke-dasharray="2 2"/>

      <!-- Transport + IP -->
      <rect x="0" y="32" width="270" height="22" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5" rx="4"/>
      <text x="135" y="47" class="layer-txt" fill="#a78bfa" text-anchor="middle">Warstwy Logiczne (TCP / IP)</text>

      <line x1="20" y1="59" x2="250" y2="59" stroke="#64748b" stroke-width="1" stroke-dasharray="2 2"/>

      <!-- Dostęp do medium -->
      <rect x="0" y="64" width="270" height="22" fill="#0f172a" stroke="#34d399" stroke-width="1.5" rx="4"/>
      <text x="135" y="79" class="layer-txt" fill="#34d399" text-anchor="middle">Medium Fizyczne (Skrętka, Światłowód, Wi-Fi)</text>
    </g>

    <!-- Skutek -->
    <g transform="translate(25, 155)">
      <rect width="270" height="30" class="badge-ok"/>
      <text x="135" y="20" font-family="system-ui, sans-serif" font-size="10px" font-weight="700" fill="#86efac" text-anchor="middle">✅ Wymiana kabla lub karty NIE dotyka aplikacji!</text>
    </g>
  </g>
</svg>
