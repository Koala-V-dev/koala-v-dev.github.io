<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 250" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .hdr { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
      .org-name { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 800; }
      .org-sub { font-family: system-ui, sans-serif; font-size: 10px; fill: #94a3b8; }
      .spec { font-family: monospace; font-size: 11.5px; font-weight: 700; }
      .desc { font-family: system-ui, sans-serif; font-size: 10.5px; fill: #cbd5e1; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <text x="35" y="32" class="hdr">Kto tworzy standardy sieciowe? Podział ról w ekosystemie IT</text>
  <text x="35" y="50" class="sub">Od fizycznych standardów kabli po protokoły globalnego Internetu</text>

  <!-- 1. IEEE -->
  <g transform="translate(35, 75)">
    <rect width="155" height="150" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="8"/>
    <text x="77" y="28" class="org-name" fill="#38bdf8" text-anchor="middle">IEEE</text>
    <text x="77" y="44" class="org-sub" text-anchor="middle">Inżynierowie elektrycy</text>
    <rect x="15" y="55" width="125" height="26" fill="#0f172a" rx="4"/>
    <text x="77" y="72" class="spec" fill="#38bdf8" text-anchor="middle">IEEE 802</text>
    <text x="77" y="100" class="desc" text-anchor="middle">🔹 802.3 – Ethernet</text>
    <text x="77" y="118" class="desc" text-anchor="middle">🔹 802.11 – Wi-Fi</text>
    <text x="77" y="136" class="desc" text-anchor="middle">🔹 802.1Q – VLAN</text>
  </g>

  <!-- 2. IETF -->
  <g transform="translate(205, 75)">
    <rect width="160" height="150" fill="#1e293b" stroke="#34d399" stroke-width="2" rx="8"/>
    <text x="80" y="28" class="org-name" fill="#34d399" text-anchor="middle">IETF</text>
    <text x="80" y="44" class="org-sub" text-anchor="middle">Architekci Internetu</text>
    <rect x="15" y="55" width="130" height="26" fill="#0f172a" rx="4"/>
    <text x="80" y="72" class="spec" fill="#34d399" text-anchor="middle">Dokumenty RFC</text>
    <text x="80" y="100" class="desc" text-anchor="middle">🔹 Stos TCP / IP</text>
    <text x="80" y="118" class="desc" text-anchor="middle">🔹 HTTP, DNS, DHCP</text>
    <text x="80" y="136" class="desc" text-anchor="middle">🔹 BGP, OSPF (Routing)</text>
  </g>

  <!-- 3. ISO -->
  <g transform="translate(380, 75)">
    <rect width="155" height="150" fill="#1e293b" stroke="#a78bfa" stroke-width="2" rx="8"/>
    <text x="77" y="28" class="org-name" fill="#a78bfa" text-anchor="middle">ISO</text>
    <text x="77" y="44" class="org-sub" text-anchor="middle">Organizacja Normalizacyjna</text>
    <rect x="15" y="55" width="125" height="26" fill="#0f172a" rx="4"/>
    <text x="77" y="72" class="spec" fill="#a78bfa" text-anchor="middle">Model OSI</text>
    <text x="77" y="100" class="desc" text-anchor="middle">🔹 7-warstwowy model</text>
    <text x="77" y="118" class="desc" text-anchor="middle">🔹 Norma ISO 7498</text>
    <text x="77" y="136" class="desc" text-anchor="middle">🔹 Ramy dydaktyczne</text>
  </g>

  <!-- 4. IANA / ICANN -->
  <g transform="translate(550, 75)">
    <rect width="155" height="150" fill="#1e293b" stroke="#f59e0b" stroke-width="2" rx="8"/>
    <text x="77" y="28" class="org-name" fill="#fbbf24" text-anchor="middle">IANA / ICANN</text>
    <text x="77" y="44" class="org-sub" text-anchor="middle">Zarządcy rejestrów</text>
    <rect x="15" y="55" width="125" height="26" fill="#0f172a" rx="4"/>
    <text x="77" y="72" class="spec" fill="#fbbf24" text-anchor="middle">Adresy i Porty</text>
    <text x="77" y="100" class="desc" text-anchor="middle">🔹 Pule adresów IP</text>
    <text x="77" y="118" class="desc" text-anchor="middle">🔹 Rejestr portów (0-65k)</text>
    <text x="77" y="136" class="desc" text-anchor="middle">🔹 Domeny TLD (.com, .pl)</text>
  </g>
</svg>
