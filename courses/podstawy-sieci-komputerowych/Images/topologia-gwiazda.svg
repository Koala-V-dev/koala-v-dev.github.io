<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect x="20" y="20" width="600" height="180" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="10"/>

  <text x="40" y="48" font-family="system-ui, sans-serif" font-size="16px" font-weight="700" fill="#38bdf8">Topologia fizyczna: Gwiazda (Star Topology)</text>
  <text x="40" y="68" font-family="system-ui, sans-serif" font-size="12px" fill="#94a3b8">Współczesny standard sieci LAN – stacje wpięte do centralnego przełącznika</text>

  <!-- Kable do stacji -->
  <line x1="320" y1="135" x2="110" y2="135" stroke="#64748b" stroke-width="3"/>
  <line x1="320" y1="135" x2="530" y2="135" stroke="#64748b" stroke-width="3"/>
  <line x1="320" y1="135" x2="210" y2="95" stroke="#64748b" stroke-width="3"/>
  <line x1="320" y1="135" x2="430" y2="95" stroke="#64748b" stroke-width="3"/>

  <!-- Switch w centrum -->
  <g transform="translate(260, 110)">
    <rect width="120" height="50" fill="#0369a1" stroke="#38bdf8" stroke-width="2" rx="6"/>
    <text x="60" y="28" font-family="system-ui, sans-serif" font-size="13px" font-weight="800" fill="#fff" text-anchor="middle">SWITCH</text>
    <text x="60" y="42" font-family="monospace" font-size="10px" fill="#bae6fd" text-anchor="middle">Punkt centralny</text>
  </g>

  <!-- Host 1 (Lewo) -->
  <g transform="translate(50, 115)">
    <rect width="60" height="40" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="4"/>
    <text x="30" y="25" font-family="monospace" font-size="11px" font-weight="700" fill="#fff" text-anchor="middle">PC 1</text>
  </g>
  <!-- Host 2 (Góra lewo) -->
  <g transform="translate(180, 75)">
    <rect width="60" height="40" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="4"/>
    <text x="30" y="25" font-family="monospace" font-size="11px" font-weight="700" fill="#fff" text-anchor="middle">PC 2</text>
  </g>
  <!-- Host 3 (Góra prawo) -->
  <g transform="translate(400, 75)">
    <rect width="60" height="40" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="4"/>
    <text x="30" y="25" font-family="monospace" font-size="11px" font-weight="700" fill="#fff" text-anchor="middle">PC 3</text>
  </g>
  <!-- Host 4 (Prawo) -->
  <g transform="translate(530, 115)">
    <rect width="60" height="40" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="4"/>
    <text x="30" y="25" font-family="monospace" font-size="11px" font-weight="700" fill="#fff" text-anchor="middle">PC 4</text>
  </g>

  <text x="320" y="185" font-family="system-ui, sans-serif" font-size="11px" fill="#34d399" text-anchor="middle">✅ Przecięcie jednego kabla odcina wyłącznie jeden komputer</text>
</svg>
