<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
      .col-hdr { font-family: system-ui, sans-serif; font-size: 13.5px; font-weight: 800; text-anchor: middle; }
      .layer-txt { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 700; }
      .layer-num { font-family: monospace; font-size: 11px; font-weight: 800; text-anchor: middle; }
      .proto-txt { font-family: monospace; font-size: 9.5px; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <text x="35" y="32" class="title">Zestawienie modeli: 7 warstw ISO/OSI vs 4 warstwy TCP/IP</text>
  <text x="35" y="50" class="sub">Model teoretyczno-referencyjny (ISO) kontra model implementacyjny Internetu (IETF)</text>

  <!-- ================= KOLUMNA LEWA: ISO/OSI (7 WARSTW) ================= -->
  <g transform="translate(35, 75)">
    <text x="160" y="-8" class="col-hdr" fill="#38bdf8">Model ISO/OSI (Referencyjny)</text>

    <!-- L7 Aplikacja -->
    <g transform="translate(0, 0)">
      <rect width="320" height="26" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="4"/>
      <rect x="5" y="4" width="28" height="18" fill="#0284c7" rx="3"/>
      <text x="19" y="17" class="layer-num" fill="#f8fafc">L7</text>
      <text x="42" y="17" class="layer-txt" fill="#38bdf8">Warstwa Aplikacji (Application)</text>
    </g>

    <!-- L6 Prezentacja -->
    <g transform="translate(0, 30)">
      <rect width="320" height="26" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="4"/>
      <rect x="5" y="4" width="28" height="18" fill="#0284c7" rx="3"/>
      <text x="19" y="17" class="layer-num" fill="#f8fafc">L6</text>
      <text x="42" y="17" class="layer-txt" fill="#38bdf8">Warstwa Prezentacji (Presentation)</text>
    </g>

    <!-- L5 Sesja -->
    <g transform="translate(0, 60)">
      <rect width="320" height="26" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="4"/>
      <rect x="5" y="4" width="28" height="18" fill="#0284c7" rx="3"/>
      <text x="19" y="17" class="layer-num" fill="#f8fafc">L5</text>
      <text x="42" y="17" class="layer-txt" fill="#38bdf8">Warstwa Sesji (Session)</text>
    </g>

    <!-- L4 Transport -->
    <g transform="translate(0, 95)">
      <rect width="320" height="32" fill="#1e293b" stroke="#a78bfa" stroke-width="2" rx="4"/>
      <rect x="5" y="6" width="28" height="20" fill="#7c3aed" rx="3"/>
      <text x="19" y="21" class="layer-num" fill="#f8fafc">L4</text>
      <text x="42" y="21" class="layer-txt" fill="#a78bfa">Warstwa Transportowa (Transport)</text>
    </g>

    <!-- L3 Sieć -->
    <g transform="translate(0, 132)">
      <rect width="320" height="32" fill="#1e293b" stroke="#fbbf24" stroke-width="2" rx="4"/>
      <rect x="5" y="6" width="28" height="20" fill="#d97706" rx="3"/>
      <text x="19" y="21" class="layer-num" fill="#f8fafc">L3</text>
      <text x="42" y="21" class="layer-txt" fill="#fbbf24">Warstwa Sieciowa (Network)</text>
    </g>

    <!-- L2 Łącze danych -->
    <g transform="translate(0, 169)">
      <rect width="320" height="28" fill="#1e293b" stroke="#34d399" stroke-width="1.5" rx="4"/>
      <rect x="5" y="5" width="28" height="18" fill="#059669" rx="3"/>
      <text x="19" y="18" class="layer-num" fill="#f8fafc">L2</text>
      <text x="42" y="18" class="layer-txt" fill="#34d399">Warstwa Łącza Danych (Data Link)</text>
    </g>

    <!-- L1 Fizyczna -->
    <g transform="translate(0, 202)">
      <rect width="320" height="28" fill="#1e293b" stroke="#34d399" stroke-width="1.5" rx="4"/>
      <rect x="5" y="5" width="28" height="18" fill="#059669" rx="3"/>
      <text x="19" y="18" class="layer-num" fill="#f8fafc">L1</text>
      <text x="42" y="18" class="layer-txt" fill="#34d399">Warstwa Fizyczna (Physical)</text>
    </g>
  </g>

  <!-- ================= KOLUMNA PRAWA: TCP/IP (4 WARSTWY) ================= -->
  <g transform="translate(385, 75)">
    <text x="160" y="-8" class="col-hdr" fill="#34d399">Model TCP/IP (Praktyczny)</text>

    <!-- Warstwa Aplikacji (L7+L6+L5) -->
    <g transform="translate(0, 0)">
      <rect width="320" height="86" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="6"/>
      <text x="160" y="26" class="col-hdr" fill="#38bdf8">1. Warstwa Aplikacji</text>
      <text x="160" y="44" font-family="system-ui, sans-serif" font-size="10.5px" fill="#cbd5e1" text-anchor="middle">Łączy funkcje L7, L6 i L5 modelu OSI</text>
      <text x="160" y="65" class="proto-txt" fill="#7dd3fc" text-anchor="middle">HTTP, HTTPS, DNS, SSH, DHCP, TLS</text>
    </g>

    <!-- Warstwa Transportowa (L4) -->
    <g transform="translate(0, 95)">
      <rect width="320" height="32" fill="#1e293b" stroke="#a78bfa" stroke-width="2" rx="6"/>
      <text x="160" y="16" class="col-hdr" fill="#a78bfa">2. Warstwa Transportowa</text>
      <text x="160" y="27" class="proto-txt" fill="#c084fc" text-anchor="middle">TCP (niezawodny), UDP (szybki)</text>
    </g>

    <!-- Warstwa Internetowa (L3) -->
    <g transform="translate(0, 132)">
      <rect width="320" height="32" fill="#1e293b" stroke="#fbbf24" stroke-width="2" rx="6"/>
      <text x="160" y="16" class="col-hdr" fill="#fbbf24">3. Warstwa Internetowa</text>
      <text x="160" y="27" class="proto-txt" fill="#fde68a" text-anchor="middle">IPv4, IPv6, ICMP, Routing</text>
    </g>

    <!-- Warstwa Dostępu do Sieci (L2+L1) -->
    <g transform="translate(0, 169)">
      <rect width="320" height="61" fill="#1e293b" stroke="#34d399" stroke-width="2" rx="6"/>
      <text x="160" y="22" class="col-hdr" fill="#34d399">4. Dostęp do Sieci (Network Access)</text>
      <text x="160" y="38" font-family="system-ui, sans-serif" font-size="10px" fill="#cbd5e1" text-anchor="middle">Łączy warstwę łącza danych i medium fizyczne</text>
      <text x="160" y="52" class="proto-txt" fill="#86efac" text-anchor="middle">Ethernet (802.3), Wi-Fi (802.11), MAC, ARP</text>
    </g>
  </g>
</svg>
