<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 800; fill: #f8fafc; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #94a3b8; }
      .card { fill: #1e293b; stroke-width: 1.5; rx: 10; }
      .card-acro { font-family: system-ui, sans-serif; font-size: 20px; font-weight: 800; text-anchor: middle; }
      .card-name { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #94a3b8; text-anchor: middle; }
      .card-range { font-family: monospace; font-size: 12px; font-weight: 700; text-anchor: middle; }
      .card-ex { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #cbd5e1; text-anchor: middle; }
    </style>
  </defs>

  <rect width="840" height="340" class="bg"/>

  <text x="40" y="42" class="title">Zasięgi sieci teleinformatycznych (PAN do WAN)</text>
  <text x="40" y="66" class="subtitle">Skala od urządzeń osobistych po globalny Internet</text>

  <!-- 1. PAN -->
  <g transform="translate(40, 85)">
    <rect width="140" height="215" class="card" stroke="#38bdf8"/>
    <circle cx="70" cy="40" r="22" fill="#0284c7" fill-opacity="0.2"/>
    <text x="70" y="48" font-family="sans-serif" font-size="22px" text-anchor="middle">⌚</text>
    <text x="70" y="86" class="card-acro" fill="#38bdf8">PAN</text>
    <text x="70" y="103" class="card-name">Personal Area</text>
    <rect x="20" y="118" width="100" height="24" fill="#0f172a" rx="4"/>
    <text x="70" y="134" class="card-range" fill="#38bdf8">&lt; 10 m</text>
    <text x="70" y="172" class="card-ex">Bluetooth</text>
    <text x="70" y="192" class="card-ex">Smartwatch</text>
  </g>

  <!-- 2. LAN -->
  <g transform="translate(195, 85)">
    <rect width="140" height="215" class="card" stroke="#34d399"/>
    <circle cx="70" cy="40" r="22" fill="#059669" fill-opacity="0.2"/>
    <text x="70" y="48" font-family="sans-serif" font-size="22px" text-anchor="middle">🏢</text>
    <text x="70" y="86" class="card-acro" fill="#34d399">LAN</text>
    <text x="70" y="103" class="card-name">Local Area</text>
    <rect x="20" y="118" width="100" height="24" fill="#0f172a" rx="4"/>
    <text x="70" y="134" class="card-range" fill="#34d399">do 100 m</text>
    <text x="70" y="172" class="card-ex">Dom / Biuro</text>
    <text x="70" y="192" class="card-ex">Switch / Wi-Fi</text>
  </g>

  <!-- 3. CAN -->
  <g transform="translate(350, 85)">
    <rect width="140" height="215" class="card" stroke="#a78bfa"/>
    <circle cx="70" cy="40" r="22" fill="#7c3aed" fill-opacity="0.2"/>
    <text x="70" y="48" font-family="sans-serif" font-size="22px" text-anchor="middle">🎓</text>
    <text x="70" y="86" class="card-acro" fill="#a78bfa">CAN</text>
    <text x="70" y="103" class="card-name">Campus Area</text>
    <rect x="20" y="118" width="100" height="24" fill="#0f172a" rx="4"/>
    <text x="70" y="134" class="card-range" fill="#a78bfa">1 - 5 km</text>
    <text x="70" y="172" class="card-ex">Uczelnia</text>
    <text x="70" y="192" class="card-ex">Kompleks fabryk</text>
  </g>

  <!-- 4. MAN -->
  <g transform="translate(505, 85)">
    <rect width="140" height="215" class="card" stroke="#fbbf24"/>
    <circle cx="70" cy="40" r="22" fill="#d97706" fill-opacity="0.2"/>
    <text x="70" y="48" font-family="sans-serif" font-size="22px" text-anchor="middle">🏙️</text>
    <text x="70" y="86" class="card-acro" fill="#fbbf24">MAN</text>
    <text x="70" y="103" class="card-name">Metropolitan</text>
    <rect x="20" y="118" width="100" height="24" fill="#0f172a" rx="4"/>
    <text x="70" y="134" class="card-range" fill="#fbbf24">5 - 50 km</text>
    <text x="70" y="172" class="card-ex">Ring miejski</text>
    <text x="70" y="192" class="card-ex">CCTV miejskie</text>
  </g>

  <!-- 5. WAN -->
  <g transform="translate(660, 85)">
    <rect width="140" height="215" class="card" stroke="#f43f5e"/>
    <circle cx="70" cy="40" r="22" fill="#e11d48" fill-opacity="0.2"/>
    <text x="70" y="48" font-family="sans-serif" font-size="22px" text-anchor="middle">🌍</text>
    <text x="70" y="86" class="card-acro" fill="#f43f5e">WAN</text>
    <text x="70" y="103" class="card-name">Wide Area</text>
    <rect x="15" y="118" width="110" height="24" fill="#0f172a" rx="4"/>
    <text x="70" y="134" class="card-range" fill="#f43f5e">Globalny</text>
    <text x="70" y="172" class="card-ex">Internet</text>
    <text x="70" y="192" class="card-ex">Kable morskie</text>
  </g>
</svg>
