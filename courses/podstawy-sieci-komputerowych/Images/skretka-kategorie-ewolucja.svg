<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .hdr { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #f8fafc; }
      .cat-name { font-family: system-ui, sans-serif; font-size: 15px; font-weight: 800; }
      .speed { font-family: monospace; font-size: 12px; font-weight: 700; }
      .freq { font-family: monospace; font-size: 11px; fill: #94a3b8; }
      .diff { font-family: system-ui, sans-serif; font-size: 10px; fill: #cbd5e1; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <text x="30" y="32" class="hdr">Ewolucja fizyczna skrętek: Co tak naprawdę zmienia kategoria?</text>

  <!-- 1. Cat 5e -->
  <g transform="translate(30, 55)">
    <rect width="145" height="150" fill="#1e293b" stroke="#64748b" stroke-width="1.5" rx="8"/>
    <text x="72" y="28" class="cat-name" fill="#94a3b8" text-anchor="middle">Cat 5e</text>
    <text x="72" y="48" class="speed" fill="#38bdf8" text-anchor="middle">1 Gb/s (100 m)</text>
    <text x="72" y="65" class="freq" text-anchor="middle">100 MHz</text>
    <!-- Rysunek: luźne 4 pary -->
    <rect x="25" y="78" width="95" height="35" rx="4" fill="#0f172a"/>
    <circle cx="50" cy="95" r="6" fill="#f97316"/>
    <circle cx="65" cy="95" r="6" fill="#22c55e"/>
    <circle cx="80" cy="95" r="6" fill="#3b82f6"/>
    <circle cx="95" cy="95" r="6" fill="#a855f7"/>
    <text x="72" y="132" class="diff" text-anchor="middle">Pary luźno w kablu</text>
  </g>

  <!-- 2. Cat 6 -->
  <g transform="translate(190, 55)">
    <rect width="145" height="150" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="8"/>
    <text x="72" y="28" class="cat-name" fill="#38bdf8" text-anchor="middle">Cat 6</text>
    <text x="72" y="48" class="speed" fill="#38bdf8" text-anchor="middle">10 Gb/s (55 m)</text>
    <text x="72" y="65" class="freq" text-anchor="middle">250 MHz</text>
    <!-- Rysunek: krzyżak oddzielający -->
    <rect x="25" y="78" width="95" height="35" rx="4" fill="#0f172a"/>
    <line x1="72" y1="80" x2="72" y2="110" stroke="#f59e0b" stroke-width="3"/>
    <line x1="45" y1="95" x2="100" y2="95" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="58" cy="88" r="4.5" fill="#f97316"/>
    <circle cx="86" cy="88" r="4.5" fill="#22c55e"/>
    <circle cx="58" cy="102" r="4.5" fill="#3b82f6"/>
    <circle cx="86" cy="102" r="4.5" fill="#a855f7"/>
    <text x="72" y="132" class="diff" text-anchor="middle">Krzyżak (Spline) par</text>
  </g>

  <!-- 3. Cat 6A -->
  <g transform="translate(350, 55)">
    <rect width="145" height="150" fill="#1e293b" stroke="#34d399" stroke-width="2" rx="8"/>
    <text x="72" y="28" class="cat-name" fill="#34d399" text-anchor="middle">Cat 6A</text>
    <text x="72" y="48" class="speed" fill="#34d399" text-anchor="middle">10 Gb/s (100 m)</text>
    <text x="72" y="65" class="freq" text-anchor="middle">500 MHz</text>
    <!-- Rysunek: folia + grubsza miedź -->
    <rect x="25" y="78" width="95" height="35" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
    <circle cx="48" cy="95" r="7" fill="#f97316"/>
    <circle cx="64" cy="95" r="7" fill="#22c55e"/>
    <circle cx="80" cy="95" r="7" fill="#3b82f6"/>
    <circle cx="96" cy="95" r="7" fill="#a855f7"/>
    <text x="72" y="132" class="diff" text-anchor="middle">Grubszy drut 23 AWG</text>
  </g>

  <!-- 4. Cat 8 -->
  <g transform="translate(510, 55)">
    <rect width="140" height="150" fill="#1e293b" stroke="#f59e0b" stroke-width="2" rx="8"/>
    <text x="70" y="28" class="cat-name" fill="#fbbf24" text-anchor="middle">Cat 8</text>
    <text x="70" y="48" class="speed" fill="#fbbf24" text-anchor="middle">40 Gb/s (30 m)</text>
    <text x="70" y="65" class="freq" text-anchor="middle">2000 MHz</text>
    <!-- Rysunek: pełny pancerz S/FTP -->
    <rect x="25" y="78" width="90" height="35" rx="4" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    <text x="70" y="100" font-family="monospace" font-size="11px" font-weight="800" fill="#fbbf24" text-anchor="middle">S/FTP</text>
    <text x="70" y="132" class="diff" text-anchor="middle">Top-of-Rack w DC</text>
  </g>
</svg>
