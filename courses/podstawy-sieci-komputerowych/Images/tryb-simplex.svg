<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect x="20" y="20" width="600" height="140" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="10"/>

  <text x="40" y="48" font-family="system-ui, sans-serif" font-size="16px" font-weight="700" fill="#38bdf8">Tryb Simplex: Droga jednokierunkowa</text>
  <text x="40" y="68" font-family="system-ui, sans-serif" font-size="12px" fill="#94a3b8">Sygnał podróżuje wyłącznie od nadawcy do odbiorcy. Brak kanału zwrotnego.</text>

  <!-- Droga asfaltowa -->
  <g transform="translate(40, 85)">
    <rect width="520" height="55" fill="#0f172a" rx="6" stroke="#334155" stroke-width="1"/>
    <!-- Pasy jezdni -->
    <line x1="20" y1="28" x2="500" y2="28" stroke="#475569" stroke-width="2" stroke-dasharray="8 6"/>

    <!-- Nadawca Host A -->
    <g transform="translate(30, 10)">
      <rect width="80" height="35" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" rx="4"/>
      <text x="40" y="22" font-family="system-ui, sans-serif" font-size="11px" font-weight="700" fill="#fff" text-anchor="middle">Nadajnik A</text>
    </g>

    <!-- Samochód w locie -->
    <g transform="translate(230, 14)">
      <rect width="70" height="27" fill="#38bdf8" rx="4"/>
      <text x="35" y="17" font-family="monospace" font-size="10px" font-weight="700" fill="#0f172a" text-anchor="middle">Dane ►►</text>
    </g>

    <!-- Znak zakazu wjazdu po prawej -->
    <g transform="translate(400, 14)">
      <circle cx="14" cy="14" r="13" fill="#ef4444"/>
      <rect x="5" y="11" width="18" height="6" fill="#fff" rx="1"/>
    </g>

    <!-- Odbiornik Host B -->
    <g transform="translate(435, 10)">
      <rect width="75" height="35" fill="#1e293b" stroke="#64748b" stroke-width="1.5" rx="4"/>
      <text x="37.5" y="22" font-family="system-ui, sans-serif" font-size="11px" font-weight="700" fill="#94a3b8" text-anchor="middle">Odbiornik B</text>
    </g>
  </g>
</svg>
