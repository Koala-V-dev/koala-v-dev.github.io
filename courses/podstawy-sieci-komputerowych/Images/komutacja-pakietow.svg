<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect x="20" y="20" width="600" height="180" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="10"/>

  <text x="40" y="48" font-family="system-ui, sans-serif" font-size="16px" font-weight="700" fill="#34d399">Komutacja pakietów (ARPANET i współczesny Internet)</text>
  <text x="40" y="68" font-family="system-ui, sans-serif" font-size="12px" fill="#94a3b8">Dane podzielone na pakiety (P1, P2, P3); dynamiczny routing Store-and-Forward</text>

  <!-- Ścieżka górna (P1, P2) -->
  <path d="M 120 125 L 230 100 L 410 100 L 520 125" stroke="#10b981" stroke-width="2.5" fill="none"/>
  <!-- Ścieżka dolna (P3 omija awarię) -->
  <path d="M 230 100 L 320 155 L 410 100" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 2" fill="none"/>

  <!-- Pakiety w locie -->
  <g transform="translate(145, 95)"><rect width="28" height="15" fill="#38bdf8" rx="3"/><text x="14" y="11" font-family="monospace" font-size="9px" font-weight="700" fill="#0f172a" text-anchor="middle">P1</text></g>
  <g transform="translate(290, 88)"><rect width="28" height="15" fill="#a855f7" rx="3"/><text x="14" y="11" font-family="monospace" font-size="9px" font-weight="700" fill="#fff" text-anchor="middle">P2</text></g>
  <g transform="translate(265, 140)"><rect width="28" height="15" fill="#fbbf24" rx="3"/><text x="14" y="11" font-family="monospace" font-size="9px" font-weight="700" fill="#0f172a" text-anchor="middle">P3</text></g>

  <!-- Nadawca Host A -->
  <g transform="translate(40, 95)">
    <rect width="80" height="55" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="40" y="28" font-family="system-ui, sans-serif" font-size="12px" font-weight="700" fill="#f8fafc" text-anchor="middle">Host A</text>
    <text x="40" y="44" font-family="monospace" font-size="9px" fill="#34d399" text-anchor="middle">Dzieli dane</text>
  </g>

  <!-- Router 1 -->
  <g transform="translate(200, 75)"><rect width="60" height="40" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="4"/><text x="30" y="24" font-family="monospace" font-size="10px" font-weight="700" fill="#fff" text-anchor="middle">R1</text></g>
  <!-- Router 2 (Góra) -->
  <g transform="translate(380, 75)"><rect width="60" height="40" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="4"/><text x="30" y="24" font-family="monospace" font-size="10px" font-weight="700" fill="#fff" text-anchor="middle">R2</text></g>
  <!-- Router 3 (Dół - alternatywna droga) -->
  <g transform="translate(290, 135)"><rect width="60" height="40" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" rx="4"/><text x="30" y="24" font-family="monospace" font-size="10px" font-weight="700" fill="#67e8f9" text-anchor="middle">R3 (Zapas)</text></g>

  <!-- Odbiorca Host B -->
  <g transform="translate(520, 95)">
    <rect width="80" height="55" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="40" y="28" font-family="system-ui, sans-serif" font-size="12px" font-weight="700" fill="#f8fafc" text-anchor="middle">Host B</text>
    <text x="40" y="44" font-family="monospace" font-size="9px" fill="#34d399" text-anchor="middle">Składa pakiety</text>
  </g>

  <text x="320" y="190" font-family="system-ui, sans-serif" font-size="11px" fill="#34d399" text-anchor="middle">✅ Pakiety przeplatają się na wspólnym łączu i omijają awarie tras</text>
</svg>
