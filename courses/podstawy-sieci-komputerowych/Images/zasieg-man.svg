<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 120" width="80" height="120">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card-border { fill: #1e293b; stroke: #fbbf24; stroke-width: 1.5; rx: 8; }
      .acro { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 800; fill: #fbbf24; text-anchor: middle; }
      .name { font-family: system-ui, -apple-system, sans-serif; font-size: 8.5px; font-weight: 600; fill: #94a3b8; text-anchor: middle; }
      .range-bg { fill: #0f172a; stroke: #fbbf24; stroke-width: 1; rx: 4; }
      .range-val { font-family: monospace; font-size: 10px; font-weight: 800; fill: #fbbf24; text-anchor: middle; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg"/>
  <rect x="2" y="2" width="76" height="116" class="card-border"/>

  <circle cx="40" cy="24" r="14" fill="#d97706" fill-opacity="0.25" stroke="#fbbf24" stroke-width="1"/>
  <text x="40" y="30" font-family="sans-serif" font-size="14px" text-anchor="middle">🏙️</text>

  <text x="40" y="54" class="acro">MAN</text>
  <text x="40" y="68" class="name">Miejska</text>

  <rect x="8" y="78" width="64" height="26" class="range-bg"/>
  <text x="40" y="95" class="range-val">5 - 50 km</text>
</svg>
