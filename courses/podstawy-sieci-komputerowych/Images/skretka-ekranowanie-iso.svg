<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 800; fill: #f8fafc; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 8; }
      .formula-box { fill: #0f172a; stroke: #38bdf8; stroke-width: 2; rx: 6; }
      .section-hdr { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #f8fafc; }
      .txt { font-family: system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .code { font-family: monospace; font-size: 13px; font-weight: 700; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <text x="35" y="38" class="title">Ekranowanie skrętek miedzianych wg normy ISO/IEC 11801</text>
  <text x="35" y="58" class="subtitle">Logika oznaczenia xx/yTP – od kabli nieekranowanych po standardy przemysłowe</text>

  <!-- Lewy panel: Wzór xx/yTP -->
  <g transform="translate(35, 75)">
    <rect width="375" height="230" class="card"/>
    <text x="20" y="28" class="section-hdr">Budowa oznaczenia xx / y TP</text>

    <!-- Wzór graficzny -->
    <g transform="translate(20, 42)">
      <rect width="335" height="48" class="formula-box"/>
      <text x="50" y="32" font-family="monospace" font-size="22px" font-weight="800" fill="#38bdf8" text-anchor="middle">xx</text>
      <text x="95" y="32" font-family="monospace" font-size="22px" font-weight="700" fill="#64748b" text-anchor="middle">/</text>
      <text x="140" y="32" font-family="monospace" font-size="22px" font-weight="800" fill="#34d399" text-anchor="middle">y</text>
      <text x="235" y="32" font-family="monospace" font-size="20px" font-weight="700" fill="#f8fafc" text-anchor="middle">TP (Twisted Pair)</text>
    </g>

    <!-- Objaśnienie xx -->
    <g transform="translate(20, 105)">
      <text x="0" y="15" class="code" fill="#38bdf8">xx = Ekran CAŁEGO kabla:</text>
      <text x="15" y="33" class="txt"><tspan fill="#38bdf8" font-weight="700">U</tspan> – Unshielded (brak ekranu zewnętrznego)</text>
      <text x="15" y="50" class="txt"><tspan fill="#38bdf8" font-weight="700">F</tspan> – Foil (folia aluminiowa wokół 4 par)</text>
      <text x="15" y="67" class="txt"><tspan fill="#38bdf8" font-weight="700">S</tspan> – Screen (oplot z gęstej siatki miedzianej)</text>
      <text x="15" y="84" class="txt"><tspan fill="#38bdf8" font-weight="700">SF</tspan> – Screen + Foil (oplot siatkowy ORAZ folia)</text>
    </g>

    <!-- Objaśnienie y -->
    <g transform="translate(20, 205)">
      <text x="0" y="0" class="code" fill="#34d399">y = Ekran POJEDYNCZYCH par:</text>
      <text x="15" y="16" class="txt"><tspan fill="#34d399" font-weight="700">U</tspan> – brak ekranu na parach | <tspan fill="#34d399" font-weight="700">F</tspan> – folia na każdej parze</text>
    </g>
  </g>

  <!-- Prawy panel: Typowe konstrukcje w praktyce -->
  <g transform="translate(430, 75)">
    <rect width="375" height="230" class="card"/>
    <text x="20" y="28" class="section-hdr">Praktyczne konstrukcje skrętek</text>

    <!-- U/UTP -->
    <g transform="translate(20, 42)">
      <rect width="335" height="38" fill="#0f172a" stroke="#334155" rx="5"/>
      <text x="12" y="18" class="code" fill="#94a3b8">U/UTP (dawniej UTP)</text>
      <text x="12" y="31" font-family="system-ui, sans-serif" font-size="10.5px" fill="#cbd5e1">Zero ekranu. Elastyczny, tani. Typowy w mieszkaniach.</text>
    </g>

    <!-- F/UTP -->
    <g transform="translate(20, 86)">
      <rect width="335" height="38" fill="#0f172a" stroke="#38bdf8" stroke-width="1" rx="5"/>
      <text x="12" y="18" class="code" fill="#38bdf8">F/UTP (dawniej FTP)</text>
      <text x="12" y="31" font-family="system-ui, sans-serif" font-size="10.5px" fill="#cbd5e1">Wspólna folia na 4 parach. Ochrona przed zakłóceniami.</text>
    </g>

    <!-- U/FTP -->
    <g transform="translate(20, 130)">
      <rect width="335" height="38" fill="#0f172a" stroke="#34d399" stroke-width="1" rx="5"/>
      <text x="12" y="18" class="code" fill="#34d399">U/FTP</text>
      <text x="12" y="31" font-family="system-ui, sans-serif" font-size="10.5px" fill="#cbd5e1">Każda para w osobnej folii. Brak przesłuchu między parami.</text>
    </g>

    <!-- S/FTP -->
    <g transform="translate(20, 174)">
      <rect width="335" height="42" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" rx="5"/>
      <text x="12" y="18" class="code" fill="#fbbf24">S/FTP (dawniej STP / PiMF)</text>
      <text x="12" y="32" font-family="system-ui, sans-serif" font-size="10.5px" fill="#cbd5e1">Oplot na kablu + folia na parach. Standard w szafach RACK i Cat 7/8.</text>
    </g>
  </g>

  <!-- Dolny pas ostrzegawczy -->
  <g transform="translate(35, 318)">
    <rect width="770" height="44" fill="#451a03" stroke="#f59e0b" stroke-width="1.5" rx="6"/>
    <text x="16" y="22" font-family="system-ui, sans-serif" font-size="11.5px" font-weight="700" fill="#fde68a">⚠️ ZASADA ELEKTROTECHNICZNA:</text>
    <text x="16" y="36" font-family="system-ui, sans-serif" font-size="10.5px" fill="#fed7aa">Kable ekranowane (FTP, STP) wymagają uziemienia ekranu w patchpanelu. Nieuziemiony ekran działa jak antena zbierająca zakłócenia!</text>
  </g>
</svg>
