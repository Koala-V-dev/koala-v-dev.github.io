<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect x="20" y="20" width="600" height="180" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" rx="10"/>

  <text x="40" y="48" font-family="system-ui, sans-serif" font-size="16px" font-weight="700" fill="#3b82f6">Architektura Klient - Serwer (Client-Server)</text>
  <text x="40" y="68" font-family="system-ui, sans-serif" font-size="12px" fill="#94a3b8">Klienci żądają zasobów od centralnego serwera nasłuchującego na stałym porcie</text>

  <!-- Klienci po lewej -->
  <g transform="translate(40, 85)">
    <rect width="90" height="26" fill="#0f172a" stroke="#64748b" rx="4"/>
    <text x="45" y="17" font-family="monospace" font-size="10px" font-weight="700" fill="#cbd5e1" text-anchor="middle">Klient 1</text>
  </g>
  <g transform="translate(40, 120)">
    <rect width="90" height="26" fill="#0f172a" stroke="#64748b" rx="4"/>
    <text x="45" y="17" font-family="monospace" font-size="10px" font-weight="700" fill="#cbd5e1" text-anchor="middle">Klient 2</text>
  </g>
  <g transform="translate(40, 155)">
    <rect width="90" height="26" fill="#0f172a" stroke="#64748b" rx="4"/>
    <text x="45" y="17" font-family="monospace" font-size="10px" font-weight="700" fill="#cbd5e1" text-anchor="middle">Klient 3</text>
  </g>

  <!-- Linie do serwera -->
  <line x1="130" y1="98" x2="350" y2="135" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 2"/>
  <line x1="130" y1="133" x2="350" y2="135" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 2"/>
  <line x1="130" y1="168" x2="350" y2="135" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 2"/>

  <!-- Serwer po prawej -->
  <g transform="translate(350, 95)">
    <rect width="230" height="80" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2" rx="8"/>
    <text x="115" y="28" font-family="system-ui, sans-serif" font-size="13px" font-weight="800" fill="#93c5fd" text-anchor="middle">SERWER CENTRALNY</text>
    <text x="115" y="48" font-family="monospace" font-size="11px" fill="#bfdbfe" text-anchor="middle">IP: 192.168.1.100</text>
    <text x="115" y="66" font-family="monospace" font-size="11px" fill="#bfdbfe" text-anchor="middle">Nasłuch na porcie 80/443</text>
  </g>
</svg>
