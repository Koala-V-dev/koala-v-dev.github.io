<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4ade80"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>

  <!-- Tło -->
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <!-- Tytuł -->
  <text x="480" y="34" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">Protokół UDP (RFC 768) i eliminacja Head-of-Line Blocking</text>
  <text x="480" y="54" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Struktura nagłówka 8B oraz różnica w dostarczaniu pakietów do pętli gry</text>

  <!-- CZĘŚĆ 1: NAGŁÓWEK UDP (8 bajtów / 64 bity) -->
  <g transform="translate(60, 75)">
    <rect width="840" height="110" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="420" y="20" fill="#38bdf8" font-size="12" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">STRUKTURA NAGŁÓWKA UDP (DOKŁADNIE 8 BAJTÓW / 64 BITY)</text>
    
    <!-- Skala bitowa -->
    <text x="30" y="38" fill="#64748b" font-size="10" font-family="monospace">Bit 0</text>
    <text x="420" y="38" fill="#64748b" font-size="10" font-family="monospace" text-anchor="middle">Bit 15 | Bit 16</text>
    <text x="810" y="38" fill="#64748b" font-size="10" font-family="monospace" text-anchor="end">Bit 31</text>

    <!-- Pola nagłówka -->
    <rect x="25" y="44" width="390" height="28" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="220" y="62" fill="#e2e8f0" font-size="11" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">Source Port (16 bitów: 0..65535)</text>

    <rect x="425" y="44" width="390" height="28" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="620" y="62" fill="#e2e8f0" font-size="11" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">Destination Port (16 bitów: 0..65535)</text>

    <rect x="25" y="76" width="390" height="26" rx="3" fill="#1e293b" stroke="#4ade80" stroke-width="1"/>
    <text x="220" y="93" fill="#4ade80" font-size="11" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">Length (16 bitów: nagłówek 8B + payload)</text>

    <rect x="425" y="76" width="390" height="26" rx="3" fill="#1e293b" stroke="#facc15" stroke-width="1"/>
    <text x="620" y="93" fill="#facc15" font-size="11" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">Checksum (16 bitów: suma kontrolna)</text>
  </g>

  <!-- CZĘŚĆ 2: PORÓWNANIE PRZEPŁYWU PAKIETÓW: TCP VS UDP -->
  <!-- TCP KOREKTA I BLOKOWANIE -->
  <g transform="translate(60, 205)">
    <rect width="405" height="315" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <rect width="405" height="28" rx="6" fill="#450a0a"/>
    <text x="202" y="19" fill="#fca5a5" font-size="12" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">TCP: Head-of-Line Blocking (Zamrożenie gry)</text>

    <!-- Oś czasu Nadawca / Sieć / Odbiorca -->
    <line x1="60" y1="45" x2="60" y2="295" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="60" y="42" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">Nadawca</text>

    <line x1="345" y1="45" x2="345" y2="295" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="345" y="42" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">Odbiorca (Kernel)</text>

    <!-- Pakiet 1 -->
    <line x1="60" y1="65" x2="340" y2="95" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="180" y="74" fill="#38bdf8" font-size="10" font-family="system-ui, sans-serif">Pakiet #1 (Poz X)</text>
    <rect x="350" y="87" width="45" height="16" rx="2" fill="#065f46"/>
    <text x="372" y="99" fill="#a7f3d0" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">-> Gra</text>

    <!-- Pakiet 2 - utracony -->
    <line x1="60" y1="110" x2="200" y2="128" stroke="#ef4444" stroke-width="1.5"/>
    <text x="210" y="132" fill="#ef4444" font-size="14" font-weight="bold">✕</text>
    <text x="130" y="115" fill="#f87171" font-size="10" font-family="system-ui, sans-serif">Pakiet #2 (ZGUBIONY)</text>

    <!-- Pakiet 3 - dotarł, ale zablokowany! -->
    <line x1="60" y1="145" x2="340" y2="175" stroke="#facc15" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="180" y="154" fill="#facc15" font-size="10" font-family="system-ui, sans-serif">Pakiet #3 (Poz Z)</text>

    <!-- Bufor blokujący w TCP -->
    <rect x="300" y="178" width="95" height="36" rx="3" fill="#7f1d1d" stroke="#ef4444" stroke-width="1"/>
    <text x="347" y="192" fill="#fecaca" font-size="9" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">Bufor Kernela:</text>
    <text x="347" y="206" fill="#fecaca" font-size="8" font-family="system-ui, sans-serif" text-anchor="middle">Czeka na #2 (BLOKADA)</text>

    <!-- Retransmisja po RTT -->
    <line x1="60" y1="225" x2="340" y2="255" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow-red)"/>
    <text x="170" y="235" fill="#f87171" font-size="9" font-family="system-ui, sans-serif">Retransmisja #2 (po ~200ms)</text>

    <rect x="25" y="270" width="355" height="32" rx="4" fill="#1e1b4b"/>
    <text x="202" y="284" fill="#c7d2fe" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">Pętla gry zamrożona przez 200ms na pakiet #2,</text>
    <text x="202" y="296" fill="#a5b4fc" font-size="8" font-family="system-ui, sans-serif" text-anchor="middle">mimo że fizycznie pakiet #3 już dawno dotarł do karty!</text>
  </g>

  <!-- UDP PRZEPŁYW CZASU RZECZYWISTEGO -->
  <g transform="translate(495, 205)">
    <rect width="405" height="315" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
    <rect width="405" height="28" rx="6" fill="#064e3b"/>
    <text x="202" y="19" fill="#86efac" font-size="12" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">UDP: Brak bufora HoL (Natychmiastowe klatki)</text>

    <!-- Oś czasu Nadawca / Sieć / Odbiorca -->
    <line x1="60" y1="45" x2="60" y2="295" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="60" y="42" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">Nadawca</text>

    <line x1="345" y1="45" x2="345" y2="295" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="345" y="42" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">Pętla Gry (recvfrom)</text>

    <!-- Pakiet 1 -->
    <line x1="60" y1="65" x2="340" y2="95" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="180" y="74" fill="#38bdf8" font-size="10" font-family="system-ui, sans-serif">Pakiet #1 (Klatka 1)</text>
    <rect x="350" y="87" width="45" height="16" rx="2" fill="#065f46"/>
    <text x="372" y="99" fill="#a7f3d0" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">Klatka 1</text>

    <!-- Pakiet 2 - utracony -->
    <line x1="60" y1="110" x2="200" y2="128" stroke="#ef4444" stroke-width="1.5"/>
    <text x="210" y="132" fill="#ef4444" font-size="14" font-weight="bold">✕</text>
    <text x="130" y="115" fill="#f87171" font-size="10" font-family="system-ui, sans-serif">Pakiet #2 (ZGUBIONY)</text>

    <!-- Pakiet 3 - natychmiast przekazany do gry! -->
    <line x1="60" y1="145" x2="340" y2="175" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrow-green)"/>
    <text x="180" y="154" fill="#4ade80" font-size="10" font-family="system-ui, sans-serif">Pakiet #3 (Klatka 3)</text>
    <rect x="350" y="167" width="45" height="16" rx="2" fill="#065f46"/>
    <text x="372" y="179" fill="#a7f3d0" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">Klatka 3</text>

    <!-- Pakiet 4 - klatka 4 -->
    <line x1="60" y1="205" x2="340" y2="235" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrow-green)"/>
    <text x="180" y="214" fill="#4ade80" font-size="10" font-family="system-ui, sans-serif">Pakiet #4 (Klatka 4)</text>
    <rect x="350" y="227" width="45" height="16" rx="2" fill="#065f46"/>
    <text x="372" y="239" fill="#a7f3d0" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">Klatka 4</text>

    <rect x="25" y="270" width="355" height="32" rx="4" fill="#064e3b"/>
    <text x="202" y="284" fill="#a7f3d0" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">Zero opóźnień: brakująca klatka #2 zostaje pominięta,</text>
    <text x="202" y="296" fill="#6ee7b7" font-size="8" font-family="system-ui, sans-serif" text-anchor="middle">silnik gry interpoluje ruch bezpośrednio do najnowszej klatki #3 i #4.</text>
  </g>
</svg>