<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 295" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .header-title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .header-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; }
      .title { font-family: system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .node-host { fill: #0f172a; stroke: #38bdf8; stroke-width: 1.5; rx: 4; }
      .node-switch { fill: #0369a1; stroke: #38bdf8; stroke-width: 2; rx: 6; }
      .node-text { font-family: monospace; font-size: 10px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .wire { stroke: #64748b; stroke-width: 2; }
      .wire-bus { stroke: #f59e0b; stroke-width: 3.5; }
      .wire-mesh { stroke: #10b981; stroke-width: 1.5; }
      .term-box { fill: #7f1d1d; stroke: #ef4444; stroke-width: 1.5; rx: 3; }
      .term-text { font-family: monospace; font-size: 8px; font-weight: 700; fill: #fecaca; text-anchor: middle; }
      .pill-text { font-family: system-ui, sans-serif; font-size: 10.5px; font-weight: 700; text-anchor: middle; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="960" height="295" class="bg"/>

  <g transform="translate(40, 32)">
    <text x="0" y="0" class="header-title">Podstawowe topologie fizyczne sieci komputerowych</text>
    <text x="0" y="20" class="header-desc">Geometria ułożenia kabli, punkty awarii i schematy połączeń w infrastrukturze</text>
  </g>

  <!-- ================= 1. GWIAZDA (STAR) ================= -->
  <g transform="translate(30, 75)" filter="url(#shadow)">
    <rect width="215" height="195" class="card" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="16" y="26" class="title" fill="#38bdf8">1. Gwiazda (Star)</text>
    <text x="16" y="42" class="subtitle">Centralny przełącznik (Switch)</text>

    <!-- Rysunek gwiazdy -->
    <g transform="translate(16, 52)">
      <line x1="90" y1="40" x2="30" y2="10" class="wire"/>
      <line x1="90" y1="40" x2="150" y2="10" class="wire"/>
      <line x1="90" y1="40" x2="30" y2="70" class="wire"/>
      <line x1="90" y1="40" x2="150" y2="70" class="wire"/>

      <g transform="translate(62, 26)">
        <rect width="56" height="28" class="node-switch"/>
        <text x="28" y="18" class="node-text" fill="#fff">SWITCH</text>
      </g>

      <g transform="translate(12, 0)"><rect width="36" height="20" class="node-host"/><text x="18" y="14" class="node-text">PC 1</text></g>
      <g transform="translate(132, 0)"><rect width="36" height="20" class="node-host"/><text x="18" y="14" class="node-text">PC 2</text></g>
      <g transform="translate(12, 60)"><rect width="36" height="20" class="node-host"/><text x="18" y="14" class="node-text">PC 3</text></g>
      <g transform="translate(132, 60)"><rect width="36" height="20" class="node-host"/><text x="18" y="14" class="node-text">PC 4</text></g>
    </g>

    <!-- Pigułka -->
    <rect x="14" y="142" width="187" height="36" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
    <text x="107" y="165" class="pill-text" fill="#38bdf8">Izolacja uszkodzeń • SPoF</text>
  </g>

  <!-- ================= 2. MAGISTRALA (BUS) ================= -->
  <g transform="translate(260, 75)" filter="url(#shadow)">
    <rect width="215" height="195" class="card"/>
    <text x="16" y="26" class="title">2. Magistrala (Bus)</text>
    <text x="16" y="42" class="subtitle">Historyczny kabel koncentryczny</text>

    <!-- Rysunek magistrali -->
    <g transform="translate(16, 52)">
      <line x1="20" y1="52" x2="165" y2="52" class="wire-bus"/>
      <g transform="translate(5, 42)"><rect width="18" height="20" class="term-box"/><text x="9" y="13" class="term-text">50Ω</text></g>
      <g transform="translate(165, 42)"><rect width="18" height="20" class="term-box"/><text x="9" y="13" class="term-text">50Ω</text></g>

      <line x1="45" y1="52" x2="45" y2="24" class="wire"/>
      <line x1="95" y1="52" x2="95" y2="24" class="wire"/>
      <line x1="145" y1="52" x2="145" y2="24" class="wire"/>

      <g transform="translate(27, 4)"><rect width="36" height="20" class="node-host"/><text x="18" y="14" class="node-text">PC A</text></g>
      <g transform="translate(77, 4)"><rect width="36" height="20" class="node-host"/><text x="18" y="14" class="node-text">PC B</text></g>
      <g transform="translate(127, 4)"><rect width="36" height="20" class="node-host"/><text x="18" y="14" class="node-text">PC C</text></g>
    </g>

    <!-- Pigułka -->
    <rect x="14" y="142" width="187" height="36" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="1"/>
    <text x="107" y="165" class="pill-text" fill="#fbbf24">Terminatory 50Ω • Brak zapasu</text>
  </g>

  <!-- ================= 3. PIERŚCIEŃ (RING) ================= -->
  <g transform="translate(490, 75)" filter="url(#shadow)">
    <rect width="215" height="195" class="card"/>
    <text x="16" y="26" class="title">3. Pierścień (Ring)</text>
    <text x="16" y="42" class="subtitle">Zamknięta pętla sąsiadów</text>

    <!-- Rysunek pętli -->
    <g transform="translate(16, 52)">
      <circle cx="92" cy="40" r="32" stroke="#10b981" stroke-width="2.5" fill="none"/>
      <g transform="translate(74, -2)"><rect width="36" height="18" class="node-host"/><text x="18" y="13" class="node-text">A</text></g>
      <g transform="translate(126, 31)"><rect width="36" height="18" class="node-host"/><text x="18" y="13" class="node-text">B</text></g>
      <g transform="translate(74, 64)"><rect width="36" height="18" class="node-host"/><text x="18" y="13" class="node-text">C</text></g>
      <g transform="translate(22, 31)"><rect width="36" height="18" class="node-host"/><text x="18" y="13" class="node-text">D</text></g>
    </g>

    <!-- Pigułka -->
    <rect x="14" y="142" width="187" height="36" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
    <text x="107" y="165" class="pill-text" fill="#34d399">Regeneracja sygnału • FDDI</text>
  </g>

  <!-- ================= 4. SIATKA (MESH) ================= -->
  <g transform="translate(720, 75)" filter="url(#shadow)">
    <rect width="215" height="195" class="card" stroke="#10b981" stroke-width="1.5"/>
    <text x="16" y="26" class="title" fill="#34d399">4. Siatka (Mesh)</text>
    <text x="16" y="42" class="subtitle">Pełna redundancja tras</text>

    <!-- Rysunek siatki -->
    <g transform="translate(16, 52)">
      <line x1="30" y1="12" x2="150" y2="12" class="wire-mesh"/>
      <line x1="150" y1="12" x2="150" y2="68" class="wire-mesh"/>
      <line x1="150" y1="68" x2="30" y2="68" class="wire-mesh"/>
      <line x1="30" y1="68" x2="30" y2="12" class="wire-mesh"/>
      <line x1="30" y1="12" x2="150" y2="68" class="wire-mesh"/>
      <line x1="150" y1="12" x2="30" y2="68" class="wire-mesh"/>

      <g transform="translate(16, 2)"><rect width="28" height="18" class="node-host"/><text x="14" y="13" class="node-text">R1</text></g>
      <g transform="translate(136, 2)"><rect width="28" height="18" class="node-host"/><text x="14" y="13" class="node-text">R2</text></g>
      <g transform="translate(136, 58)"><rect width="28" height="18" class="node-host"/><text x="14" y="13" class="node-text">R3</text></g>
      <g transform="translate(16, 58)"><rect width="28" height="18" class="node-host"/><text x="14" y="13" class="node-text">R4</text></g>
    </g>

    <!-- Pigułka -->
    <rect x="14" y="142" width="187" height="36" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
    <text x="107" y="165" class="pill-text" fill="#34d399">L = N(N-1)/2 • WAN / DC</text>
  </g>
</svg>