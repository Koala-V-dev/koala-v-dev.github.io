<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect x="20" y="20" width="600" height="190" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" rx="10"/>

  <text x="40" y="48" font-family="system-ui, sans-serif" font-size="16px" font-weight="700" fill="#fbbf24">Topologia logiczna: Wielodostęp (Multiaccess / Broadcast)</text>
  <text x="40" y="68" font-family="system-ui, sans-serif" font-size="12px" fill="#94a3b8">Wspólne medium – sygnał wysłany przez jeden host dociera do wszystkich</text>

  <!-- Szyna logiczna -->
  <line x1="60" y1="165" x2="580" y2="165" stroke="#f59e0b" stroke-width="5"/>

  <!-- Odczepy i stacje -->
  <!-- Stacja 1 -->
  <line x1="120" y1="165" x2="120" y2="135" stroke="#f59e0b" stroke-width="2"/>
  <g transform="translate(75, 80)">
    <rect width="90" height="55" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" rx="6"/>
    <text x="45" y="28" font-family="system-ui, sans-serif" font-size="13px" font-weight="700" fill="#f8fafc" text-anchor="middle">Host A</text>
    <text x="45" y="44" font-family="monospace" font-size="10px" fill="#fbbf24" text-anchor="middle">📢 Nadaje</text>
  </g>

  <!-- Stacja 2 -->
  <line x1="320" y1="165" x2="320" y2="135" stroke="#f59e0b" stroke-width="2"/>
  <g transform="translate(275, 80)">
    <rect width="90" height="55" fill="#0f172a" stroke="#64748b" stroke-width="1.5" rx="6"/>
    <text x="45" y="28" font-family="system-ui, sans-serif" font-size="13px" font-weight="700" fill="#f8fafc" text-anchor="middle">Host B</text>
    <text x="45" y="44" font-family="monospace" font-size="10px" fill="#94a3b8" text-anchor="middle">Odbiera</text>
  </g>

  <!-- Stacja 3 -->
  <line x1="520" y1="165" x2="520" y2="135" stroke="#f59e0b" stroke-width="2"/>
  <g transform="translate(475, 80)">
    <rect width="90" height="55" fill="#0f172a" stroke="#64748b" stroke-width="1.5" rx="6"/>
    <text x="45" y="28" font-family="system-ui, sans-serif" font-size="13px" font-weight="700" fill="#f8fafc" text-anchor="middle">Host C</text>
    <text x="45" y="44" font-family="monospace" font-size="10px" fill="#94a3b8" text-anchor="middle">Odbiera</text>
  </g>

  <text x="320" y="195" font-family="system-ui, sans-serif" font-size="11px" font-weight="600" fill="#f59e0b" text-anchor="middle">⚡ Ryzyko kolizji, gdy co najmniej dwie stacje nadają jednocześnie</text>
</svg>
